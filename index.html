const CASES = [{"id":"a1","cat":"aggr","no":1,"lvText":"초등","lv":["초"],"t":"경쟁에서 지거나 자신의 의견이 받아들여지지 않자 물건을 던지고 친구에게 소리 지르는 행동","scene":"체육시간 공 옮기기 모둠 대항 릴레이에서 자기 모둠이 지자, 학생이 들고 있던 공을 바닥에 세게 던지고 같은 모둠 친구에게 “너 때문에 졌잖아!”라고 소리쳤다. 친구가 사과한 뒤에도 큰 소리로 비난을 계속했고, 교사가 다가오자 운동장 한쪽으로 달려가 활동에 참여하지 않았다.","abc":[{"r":"1회차(9/3)","a":"체육시간 공 옮기기 모둠 대항 릴레이에서 자기 모둠이 짐","b":"공을 바닥에 세게 던지고 모둠 친구에게 “너 때문에 졌잖아!”라고 소리침","c":"친구가 사과하고 주변 학생들이 쳐다봄. 교사가 다가와 활동을 잠시 중단함"},{"r":"2회차(9/6)","a":"보드게임에서 친구에게 연속으로 짐","b":"게임판을 밀치고 “다시는 안 해”라고 소리치며 자리를 떠남","c":"게임이 중단되고 친구들이 학생을 따라가 말을 걸며 달램"},{"r":"3회차(9/10)","a":"미술 모둠활동에서 자신의 의견이 선택되지 않음","b":"색연필을 책상에 던지고 친구에게 “내 말대로 해”라고 큰 소리로 말함","c":"모둠원들이 의견 제시를 멈추고 학생이 제안한 방법으로 활동을 시작함. 교사가 다가와 상황을 확인함"}],"target":"관찰할 문제행동은 ‘경쟁에서 지거나 자신의 의견이 받아들여지지 않은 상황에서 물건을 던지거나 친구에게 큰 소리로 비난·위협하는 말을 하는 행동’으로 정합니다. 물건을 던지는 행동과 소리 지르는 행동을 구분하여, 던진 물건과 방향, 실제 말한 표현, 각 행동의 횟수와 행동 직후의 반응을 구체적으로 기록합니다.","hyp":["OO의 행동은 경쟁에서 지거나 자신의 의견이 받아들여지지 않은 상황에서 나타났습니다. 1·2회차에서는 행동 직후 활동이 중단되었고, 친구들의 사과나 달래기가 뒤따랐습니다. 3회차에서는 모둠원들이 학생의 의견을 따랐습니다. 이러한 기록을 볼 때, 1·2회차에서는 활동 중단과 또래의 반응이 함께 뒤따랐습니다. 다만 1회차는 경기 종료 뒤인지, 다음 경기나 결과 확인 등 남아 있던 활동이 중단된 것인지 확인해야 합니다. 남은 활동·요구가 반복적으로 중단되면 회피·도피 기능을, 또래의 반응 이후 행동이 이어지면 관심 획득 기능을 가설로 검토합니다. 3회차에서는 자신의 의견대로 활동이 진행되었으므로 요구·획득 기능을 살펴볼 수 있습니다. 같은 형태의 행동이라도 상황별 기능이 다를 수 있으므로 추가 관찰과 학생 면담을 통해 가설을 검토합니다."],"causes":["회피·도피 기능: 경쟁에서 지거나 자신의 뜻대로 진행되지 않는 활동을 중단하거나 잠시 벗어나려는지 살펴봅니다.","요구·획득 기능: 물건을 던지거나 소리를 지른 뒤 자신의 의견이 채택되는 경험이 반복되는지 확인합니다.","관심 기능: 친구들의 사과·달래기와 교사의 개별적인 반응이 행동을 유지하는 데 영향을 주는지 살펴봅니다.","관련 기술과 환경: 실망감을 표현하기, 휴식을 요청하기, 다른 의견을 듣고 협의하기 등의 기술을 배웠는지 확인합니다. 승패를 지나치게 강조하는 활동 방식, 또래의 놀림이나 비난이 있었는지도 함께 살핍니다."],"rintro":"","repl":[{"beh":"활동이 부담스러울 때 “잠깐 쉬고 싶어요”라고 말하거나 휴식카드를 제시하기 — 회피·도피 기능에 대응","teach":"평온한 때 휴식 요청 방법과 쉴 장소, 활동으로 돌아오는 절차를 설명하고 역할극으로 연습함","rein":"적절하게 요청하면 약속한 짧은 휴식을 제공하고, 말이나 카드로 요청한 행동을 구체적으로 칭찬함"},{"beh":"자신의 의견을 반영하고 싶을 때 “내 생각도 설명해도 될까?”라고 요청하고, 정해진 순서에 따라 의견을 조율하기 — 요구·획득 기능에 대응, 의견을 제시할 기회를 얻는 행동과 결과를 수용하는 기술을 구분하여 지도","teach":"의견 말하기–상대 의견 듣기–공통 기준으로 결정하기를 그림카드와 모의 활동으로 연습함. 의견이 채택되지 않으면 “아쉽지만 이번에는 이 방법으로 해볼게”라고 말하거나 짧은 휴식을 요청하는 방법도 연습함","rein":"요청하면 의견을 설명하고 공정하게 협의할 기회를 제공함. 의견 채택 여부와 관계없이 협의 절차와 결정된 활동에 참여한 행동을 칭찬함"},{"beh":"속상하거나 도움이 필요할 때 “선생님, 제 이야기 좀 들어주세요”라고 요청하기 — 관심 기능에 대응","teach":"교사에게 다가가기, 약속한 신호 보내기, 말로 도움 요청하기 중 학생에게 적합한 방법을 연습함","rein":"요청에 짧고 따뜻하게 반응하여 이야기를 듣고, 필요한 도움을 제공함. 평소에도 적절한 참여에 긍정적인 관심을 제공함"}],"s1":[["b","활동 전에 ‘도구를 안전하게 사용하기’, ‘친구를 비난하지 않기’, ‘의견이 다르면 차례로 말하기’를 구체적인 기대행동으로 안내합니다."],["b","승패 상황과 의견이 선택되지 않은 상황에서 사용할 표현을 설명하고 역할극으로 연습합니다. 예: “아쉽지만 다음에 다시 해보자.”, “내 생각도 설명해도 될까?”, “잠깐 쉬고 다시 참여할게.”"],["b","승패뿐 아니라 협력과 역할 수행을 경험할 수 있도록 활동을 구성하고, 경기 결과와 관계없이 규칙 준수·격려·도움 요청 행동을 칭찬합니다."],["b","모둠활동에서는 의견을 결정하는 방법과 순서를 미리 정하여 특정 학생의 큰 목소리나 강한 행동에 따라 결정이 바뀌지 않도록 합니다."],["q","“경기에서 지거나 내 의견이 선택되지 않으면 속상할 수 있어요. 그럴 때는 도구를 안전하게 내려놓고 말로 표현해요. 쉬고 싶으면 요청하고, 의견이 다르면 차례로 설명하며 함께 정한 방법으로 결정해요.”"]],"s2":[["b","활동 전에 학생과 그날 사용할 대체행동 한두 가지를 확인합니다. 휴식 요청이나 도움 요청 방법을 짧게 연습하고 교사가 어떻게 반응할지도 알려줍니다."],["b","학생에게 맞는 활동 난이도와 역할을 제공하고, 짧은 활동부터 규칙을 지키며 참여하는 경험을 쌓도록 돕습니다."],["b","목소리가 커지거나 도구를 거칠게 다루는 등 초기 신호가 보이면 조용히 접근하여 사전에 약속한 신호로 대체행동을 상기시킵니다."],["b","물건 던지기가 나타나면 주변 학생과 거리를 확보하고 위험한 도구 사용을 중단합니다. 공개적인 추궁이나 긴 논쟁을 피하고 짧고 차분하게 안전 행동을 안내합니다."],["q","“공을 바닥에 내려놓자. 지금은 친구와 조금 떨어져서 쉬자. 선생님이 여기 있을게.”"],["b","충분히 안정된 뒤 상황을 확인하고, 해당 상황에서 사용할 대체행동을 다시 연습합니다. 학생의 상태에 맞게 역할·시간·참여 방법을 조정하여 활동 복귀를 돕습니다."],["q","“경기가 끝난 뒤 많이 속상해 보였어. 어떤 점이 가장 힘들었니? 다음에는 ‘잠깐 쉬고 싶어요’라고 말하거나 카드를 보여주자. 그러면 약속한 곳에서 쉬고, 다시 참여하는 방법을 함께 정할 수 있어.”"],["b","적절한 요청에 실제로 휴식·도움·의견 표현의 기회가 뒤따르도록 하고, 대체행동을 사용한 순간과 안전하게 재참여한 행동을 구체적으로 칭찬합니다."],["q","“방금 속상할 때 공을 내려놓고 쉬고 싶다고 말했구나. 안전하게 요청했어. 약속한 대로 잠깐 쉬자.”"]],"s3":[["b","활동 전에 기대행동, 도움·휴식 요청 방법, 적절하게 행동했을 때 받을 지원과 강화를 안내합니다."],["b","물건을 던지거나 친구에게 소리를 지르는 행동이 나타나면 안전을 위해 도구 사용이나 활동을 잠시 중단하고, 안정된 뒤 재참여 방법을 확인한다는 점을 미리 설명합니다."],["b","안전 확보와 진정 지원은 대체행동의 성공 여부와 관계없이 제공합니다. 평소에는 적절한 요청이 공격행동보다 빠르고 확실하게 필요한 도움으로 이어지도록 지원합니다."],["b","물건을 던지거나 소리를 질렀다는 이유로 경기 결과를 바꾸거나 학생의 의견을 일방적으로 채택하지 않습니다. 학생의 의견은 안정된 뒤 다른 학생과 같은 협의 절차에 따라 다룹니다."],["b","물건 던지기와 소리 지르기의 발생 횟수를 구분하여 기록합니다. 패배·의견 조율 등 관련 상황이 몇 번 있었는지와 그중 도움·휴식을 요청한 횟수, 스스로 요청했는지 교사의 신호가 필요했는지, 활동 재참여 여부를 함께 확인합니다."],["b","행동이 반복되면 교사와 총괄자가 기능 가설, 활동 조건, 대체행동 교수 및 강화가 계획대로 제공되었는지 검토하고, 학생의 필요에 맞는 행동계약·집중 연습 등 2단계 지원을 선택합니다. CICO는 성인과의 정기적인 만남과 피드백이 기능 가설과 학생의 필요에 적합한지 확인하여 적용합니다. 회피·도피 기능이 주된 경우에는 활동·과제 조정과 도움 요청 교수를 함께 제공합니다."],["b","안전 위협이 크거나 기존 지원으로 충분한 변화가 나타나지 않으면 관련 교사·보호자·전문인력과 협의하여 개별화된 행동지원과 안전대응 계획을 마련합니다."],["q","“도구를 던지면 안전을 위해 사용을 잠시 멈출 거야. 쉬고 싶다고 말하면 약속한 곳에서 쉴 수 있어. 네 의견은 차분히 설명할 기회를 줄게. 경기 결과와 모둠의 결정은 함께 정한 규칙에 따라 다루자.”"]],"caution":"패배하거나 의견이 받아들여지지 않아 느끼는 속상함은 인정하되, 물건을 던지거나 친구를 비난하는 행동은 안전하게 중단하도록 안내합니다. 학생이 안정된 뒤 휴식·도움 요청과 의견 조율 방법을 연습하고, 적절하게 요청했을 때 실제 지원과 협의 기회를 제공합니다. 다만 공격행동을 이유로 경기 결과를 바꾸거나 학생의 의견을 일방적으로 채택하지 않도록 유의합니다. 공격행동의 감소뿐 아니라 적절한 요청과 안전한 활동 재참여가 늘어나는지도 함께 확인합니다.","types":["throw","verbal"],"fns":["회피·도피","관심 획득","원하는 것 얻기"],"kw":["경쟁","패배","졌잖아","릴레이","체육","보드게임","의견","물건 던지기","소리 지르기"],"situ":["경쟁·승패","의견 대립","모둠활동"],"safety":true},{"id":"a2","cat":"aggr","no":2,"lvText":"초등","lv":["초"],"t":"친구가 자신의 실수를 지적하자 학습도구를 던지고 친구에게 소리 지르는 행동","scene":"수학시간 짝과 풀이를 비교하던 중, 친구가 학생의 활동지를 가리키며 “여기 계산이 틀렸어. 다시 봐”라고 말했다. 학생은 연필과 지우개를 바닥에 던지고 친구에게 “네가 뭔데! 내 거 보지 마!”라고 소리쳤다. 친구가 말을 멈추고 뒤로 물러나자 학생은 활동지를 뒤집고 책상에 엎드렸다. 주변 학생들이 쳐다보는 가운데 교사가 다가와 학생의 이야기를 듣고, 짝 활동을 잠시 중단하였다.","abc":[{"r":"1회차(9/3)","a":"수학 짝 활동에서 친구가 계산이 틀린 부분을 가리키며 다시 보라고 말함.","b":"연필과 지우개를 바닥에 던지고 친구에게 “내 거 보지 마!”라고 소리친 뒤 책상에 엎드림.","c":"친구가 말을 멈추고 뒤로 물러남. 교사가 다가와 이야기를 듣고 짝 활동을 잠시 중단함."},{"r":"2회차(9/6)","a":"국어시간 서로의 글을 읽는 활동에서 친구가 “이 글자는 틀렸어”라고 말함.","b":"공책을 책상 끝으로 밀어 떨어뜨리고 친구에게 “너나 잘해!”라고 소리침.","c":"친구가 더 이상 글을 살펴보지 않음. 교사가 학생과 따로 글을 확인하면서 수정 활동이 잠시 미뤄짐."},{"r":"3회차(9/10)","a":"모둠 발표 자료를 확인하던 중 친구가 “이 부분은 조사한 내용과 달라. 고쳐야 해”라고 말함.","b":"색연필을 책상에 던지고 “아! 그럼 네가 다 해!”라고 소리치며 자료를 친구 쪽으로 던짐.","c":"모둠원들이 학생에게 의견을 말하지 않음. 다른 모둠원이 해당 부분을 대신 수정함. 학생은 수정 활동에 참여하지 않음."}],"target":"관찰할 문제행동은 ‘친구에게 자신의 실수를 지적받은 상황에서 학습도구를 던지거나 그 친구에게 큰 소리로 비난하는 말을 하는 행동’으로 정합니다. 학습도구를 던지는 행동과 소리 지르는 행동을 구분하여, 던진 도구와 방향, 실제 말한 표현, 각 행동의 횟수와 행동 직후의 반응을 구체적으로 기록합니다.","hyp":["OO의 행동은 친구가 자신의 오류나 빠진 부분을 알려주는 상황에서 반복되었습니다. 행동 직후 친구의 설명이나 지적이 멈추었고, 활동이 중단·지연되거나 다른 학생이 수정할 내용을 대신 작성하였습니다. 이러한 기록을 볼 때, 공격행동은 친구에게 평가받는 상황이나 과제를 수정해야 하는 요구에서 벗어나는 회피·도피 기능을 수행했을 가능성이 있습니다. 또한 일부 상황에서는 교사의 개별적인 반응과 도움이 뒤따랐으므로, 교사의 관심이나 학습 지원을 얻는 결과도 함께 살펴볼 필요가 있습니다. 다만 학생이 친구의 말을 어떻게 받아들였는지, 과제를 실제로 수행할 수 있었는지는 관찰기록만으로 알 수 없습니다. 학생과의 개별 대화, 과제 수행 수준 확인, 추가 관찰을 통해 기능 가설을 검토합니다. 추가 관찰에서는 또래의 설명이 멈추어도 혼자 수정 과제를 계속하는지, 설명하는 사람이 교사로 바뀌어도 거부가 이어지는지 살펴봅니다. 이를 통해 또래의 평가 상황을 피하는 경우와 과제 자체가 어려운 경우를 구분합니다. 위험행동을 유발하여 확인하지 않고 일상적인 활동과 면담 자료를 활용합니다."],"causes":["또래의 평가 상황 회피: 친구가 자신의 실수를 보는 것, 다른 학생들 앞에서 오류를 지적받는 것을 부담스러워하는지 살펴봅니다.","수정 과제 회피: 틀린 부분을 이해하거나 고치는 데 어려움이 있어, 수정 요구가 중단되는 결과가 행동을 유지하는지 확인합니다.","관심·도움 획득 가능성: 교사의 관심 자체를 얻으려는 것인지, 과제 해결을 위한 구체적인 도움이 필요한 것인지 구분하여 살핍니다.","관련 기술: 불편함을 말로 표현하기, 설명을 요청하기, 피드백을 듣고 수정하기 등의 기술을 충분히 배웠는지 확인합니다.","학습·관계 환경: 과제 난이도와 피드백 방식이 적절했는지, 실제로 비난·놀림이나 반복적인 공개 지적이 있었는지도 함께 확인합니다. 친구의 지적이 있었다는 사실만으로 그 학생에게 공격행동의 책임을 돌리지 않습니다."],"rintro":"","repl":[{"beh":"친구의 설명이 부담스러울 때 “잠깐만, 내가 먼저 확인할게”라고 말하기 — 또래의 평가 상황을 잠시 멈추는 기능에 대응","teach":"평온한 때 교사가 문장을 시범 보이고, 친구가 오류를 알려주는 모의 상황에서 말하거나 요청카드를 제시하도록 연습함","rein":"적절하게 요청하면 설명을 잠시 멈추고 스스로 확인할 시간을 제공함. 말로 요청한 행동을 구체적으로 칭찬함"},{"beh":"수정 방법을 모를 때 “어디부터 고치면 될까요?”, “한 번 더 설명해 주세요”라고 요청하기 — 과제 부담을 줄이는 회피 도피 기능 가설에 대응","teach":"쉬운 오류 예시를 활용해 모르는 부분 표시하기–도움 요청하기–한 부분 수정하기를 단계적으로 연습함","rein":"요청하면 필요한 설명·예시·과제 조정을 제공함. 도움을 받아 수정에 참여한 행동을 칭찬함"},{"beh":"흥분이 높아질 때 학습도구를 내려놓고 “잠깐 쉬고 싶어요”라고 말하거나 휴식카드를 제시하기 — 부담스러운 상황에서 잠시 벗어나는 기능에 대응","teach":"도구 내려놓기, 휴식 요청하기, 약속한 곳에서 쉬기, 복귀 준비 확인하기를 짧게 연습함","rein":"요청에 따라 약속한 휴식을 제공하고, 안전하게 요청한 행동을 인정함. 안정된 뒤 조정된 활동으로 돌아오도록 도움"}],"s1":[["b","학급 전체에 실수를 발견하고 고치는 것은 학습 과정임을 안내하고, 정답뿐 아니라 확인·도움 요청·수정 행동을 구체적으로 칭찬합니다."],["b","짝·모둠활동 전에 피드백을 주고받는 방법을 가르칩니다. 상대를 평가하는 말보다 과제의 구체적인 부분을 설명하도록 합니다. 예: “이 부분을 같이 확인해 볼까?”, “나는 이렇게 풀었는데 비교해 볼래?”"],["b","피드백을 받는 학생도 “내가 먼저 확인할게”, “다시 설명해 줘”, “선생님께 같이 물어보자”라고 말하는 연습을 합니다."],["b","학습도구는 안전하게 사용하고, 의견이나 설명을 듣기 어려울 때에는 물건을 던지는 대신 말이나 카드로 요청하도록 안내합니다."],["b","짝끼리 바로 답을 지적하기 전에 스스로 확인할 시간을 주고, 필요하면 교사에게 개별적으로 도움받을 수 있도록 활동을 구성합니다."],["q","“친구의 실수를 발견하면 ‘이 부분을 같이 확인해 볼까?’라고 말해요. 설명을 듣기 어렵거나 시간이 필요하면 ‘내가 먼저 확인할게’, ‘다시 설명해 줘’라고 요청할 수 있어요. 틀린 곳을 고치려고 시도하는 것도 중요한 배움이에요.”"]],"s2":[["b","활동 전에 학생의 수행 수준과 피드백에 대한 부담을 확인합니다. 필요하면 스스로 확인한 뒤 교사에게 먼저 도움받도록 하거나, 한 번에 확인할 문항 수를 줄입니다."],["b","학생과 그날 사용할 요청 표현 한두 가지를 정하고 짧게 연습합니다. 말하기 어려울 때 사용할 도움·휴식카드와 교사의 반응도 미리 안내합니다."],["b","목소리가 커지거나 학습도구를 세게 쥐는 등 초기 신호가 나타나면 조용히 접근하여, 약속한 신호로 도구 내려놓기와 도움 요청을 상기시킵니다."],["b","학습도구를 던지면 주변 학생과 거리를 확보하고, 위험한 도구 사용을 잠시 중단합니다. 피해를 입었거나 놀란 친구의 상태도 확인합니다."],["b","흥분한 상태에서는 실수를 인정시키거나 사과·과제 수정을 즉시 요구하지 않습니다. 안전과 안정을 확보한 뒤 학생이 어떤 점을 어렵게 느꼈는지 확인합니다."],["q","“연필은 책상에 내려놓자. 지금은 친구와 조금 떨어져서 쉬자. 설명은 잠깐 멈출게.”"],["b","안정된 후에는 해당 상황에 맞는 대체 표현을 다시 연습하고, 쉬운 문항이나 짧은 수정 활동부터 재참여하도록 돕습니다."],["q","“친구가 틀린 부분을 말했을 때 어떤 점이 힘들었니? 혼자 확인할 시간이 필요하면 ‘내가 먼저 확인할게’라고 말해도 돼. 고치는 방법이 어렵다면 선생님에게 도움을 요청하자.”"],["b","적절한 요청에는 실제로 필요한 시간·설명·휴식을 제공하고, 요청하기와 수정 시도에 구체적인 칭찬을 제공합니다."],["q","“방금 지우개를 내려놓고 ‘다시 설명해 주세요’라고 말했구나. 필요한 도움을 말로 요청했어. 이 부분부터 함께 확인하자.”"]],"s3":[["b","짝·모둠활동 전에 피드백을 주고받는 방법, 도움·휴식을 요청하는 방법, 학습도구를 안전하게 사용하는 규칙을 안내합니다."],["b","적절하게 요청하면 설명을 잠시 멈추거나 필요한 도움을 받을 수 있으며, 학습도구를 던지면 안전을 위해 도구 사용과 활동을 잠시 중단한다는 점을 미리 설명합니다."],["b","안전 확보와 진정 지원은 대체행동의 성공 여부와 관계없이 제공합니다. 평소에는 적절한 요청이 공격행동보다 빠르고 확실하게 필요한 도움으로 이어지도록 지원합니다."],["b","친구에게 학생을 계속 달래거나 과제를 대신하도록 맡기지 않습니다. 교사가 상황을 조정하고, 안정된 뒤 학생이 할 수 있는 부분부터 직접 참여하도록 돕습니다."],["b","학습도구 던지기와 소리 지르기의 발생 횟수를 구분하여 기록합니다. 피드백이나 수정 요구가 있었던 기회 수와 그중 적절히 요청한 횟수, 교사의 도움 수준, 수정 활동 재참여 여부를 기록합니다. 피드백 방식과 과제 조건에 따른 차이도 확인합니다."],["b","행동이 반복되면 과제 수준, 또래관계, 기능 가설, 교수·강화의 실행 여부를 검토하고, 학생의 필요에 맞는 행동계약·집중 연습 등 2단계 지원을 선택합니다. CICO는 성인과의 정기적인 만남과 피드백이 기능 가설과 학생의 필요에 적합한지 확인하여 적용합니다. 회피·도피 기능이 주된 경우에는 활동·과제 조정과 도움 요청 교수를 함께 제공합니다."],["b","위험행동이 심화되거나 기존 지원으로 충분한 변화가 나타나지 않으면 관련 교사·보호자·전문인력과 협의하여 개별화된 행동지원 및 안전대응 계획을 마련합니다."],["q","“친구의 설명이 부담스러우면 잠깐 멈춰 달라고 말할 수 있어. 고치는 방법이 어려우면 도움을 요청하자. 도구를 던지면 안전을 위해 사용을 잠시 멈출 거야. 마음이 가라앉으면 네가 할 수 있는 부분부터 함께 시작하자.”"]],"caution":"실수를 지적받아 느끼는 당황스러움이나 속상함은 인정하되, 학습도구를 던지거나 친구에게 소리 지르는 행동은 안전하게 중단하도록 안내합니다. 공개적으로 잘못을 따지기보다 학생이 안정된 뒤 상황을 확인하고, “차분하게 말해 줘”, “선생님, 도와주세요” 등 필요한 표현을 연습합니다. 친구의 지적 방식에 놀림이나 비난이 포함되었는지도 살피며, 학급 전체가 서로 존중하며 의견을 전달하도록 지도합니다. 적절한 표현과 도움 요청에 실제로 반응하고, 안전하게 학습 활동에 다시 참여하는 행동을 강화합니다.","types":["throw","verbal"],"fns":["회피·도피","관심 획득"],"kw":["실수","지적","틀렸어","짝 활동","수학","학습도구","연필","소리 지르기"],"situ":["지적·피드백","모둠활동"],"safety":true},{"id":"a3","cat":"aggr","no":3,"lvText":"초등","lv":["초"],"t":"친구의 몸이 닿거나 부딪힌 뒤 “일부러 그랬다”고 말하며 친구를 밀치고 욕설하는 행동","scene":"쉬는 시간이 끝나 교실로 들어오는 과정에서, 앞서 걷던 친구가 뒤를 돌아보다 학생의 어깨에 부딪혔다. 친구가 “미안해. 못 봤어”라고 말했지만, 학생은 “일부러 그랬잖아!”라고 소리치며 친구의 가슴을 두 손으로 밀고 욕설하였다. 친구가 뒤로 물러난 뒤에도 학생은 따라가며 소리를 질렀고, 교사가 두 학생 사이의 거리를 확보한 뒤 각각 상황을 확인하였다.","abc":[{"r":"1회차(5/7)","a":"교실로 들어오던 친구가 뒤를 돌아보다 학생의 어깨에 부딪히고 “미안해. 못 봤어”라고 말함","b":"“일부러 그랬잖아!”라고 소리치며 친구의 가슴을 두 손으로 밀고 욕설함","c":"친구가 뒤로 물러나고 주변 학생들이 이동을 멈춤. 교사가 두 학생 사이의 거리를 확보하고 각각 상황을 확인함"},{"r":"2회차(5/10)","a":"급식 줄이 앞으로 이동하는 과정에서 뒤에 있던 친구의 팔꿈치가 학생의 등에 닿음","b":"뒤를 돌아 친구의 팔을 밀어내고 “왜 때려!”라고 소리치며 욕설함","c":"뒤에 있던 친구가 거리를 벌림. 교사가 학생을 줄 옆으로 안내하여 이야기를 듣고, 배식 순서를 잠시 조정함"},{"r":"3회차(5/14)","a":"체육시간 공을 주우러 이동하던 친구의 몸이 학생의 옆구리에 부딪힘","b":"“나한테 일부러 그랬지?”라고 소리치며 친구의 어깨를 밀고 가까이 다가감","c":"친구가 뒤로 물러나며 사과함. 교사가 활동을 잠시 멈추고 학생 옆에서 상황을 확인함"}],"target":"관찰할 문제행동은 ‘친구와 몸이 부딪힌 상황에서 친구를 밀치거나 친구에게 욕설하는 행동’으로 정합니다. 밀치는 행동과 욕설하는 행동을 구분하여, 신체 접촉의 방식과 횟수, 실제 말한 표현, 행동 직후의 반응을 구체적으로 기록합니다. 상대가 고의로 접촉했는지 여부는 학생의 말만으로 확정하지 않고 별도로 확인합니다.","hyp":["OO의 행동은 예상하지 못한 신체 접촉 직후 반복되었습니다. 학생은 접촉을 “일부러 그랬다”, “때렸다”라고 표현하였으며, 밀치거나 소리를 지른 뒤에는 친구가 물러나고 신체적 거리가 확보되었습니다. 교사가 개입하여 상황을 확인하고 활동을 잠시 중단하는 결과도 뒤따랐습니다.","이러한 기록을 볼 때, 밀치기 이후 상대가 물러나 거리가 확보되는 결과가 반복된다면 접촉·접근을 중단시키는 회피·도피 기능을 가설로 검토할 수 있습니다. 다만 접촉이 이미 끝났는지와 이후 상대의 접근이 계속되었는지 확인해야 합니다. 친구가 물러난 뒤에도 따라가거나 가까이 다가가는 행동은 거리 확보만으로 설명하기 어려우므로, 밀치기와 뒤따라가기의 발생 순서 및 이후의 사과·대화·교사 개입을 구분하여 추가 관찰합니다.","다만 “일부러 그랬다”는 발언은 상황에 대한 학생의 해석을 보여주는 것이며, 그 자체가 행동의 기능은 아닙니다. 실제 접촉 상황과 또래관계, 학생이 느낀 불편함, 행동 이후의 변화를 추가로 확인하여 기능 가설을 검토합니다."],"causes":["접촉·접근 회피: 갑작스러운 접촉을 불편하게 느끼고, 상대를 밀어내어 거리를 확보하려는지 살펴봅니다.","상황 해석과 경험: 접촉을 고의적인 공격으로 판단한 이유를 학생에게 묻고, 이전에 같은 친구와 갈등이나 반복적인 괴롭힘이 있었는지 확인합니다. 학생의 해석을 곧바로 사실로 확정하거나 단순한 오해로 치부하지 않습니다.","신체적 불편과 환경: 접촉으로 통증이 발생했는지, 특정 접촉에 불편함이 큰지, 이동 동선이나 줄 간격이 지나치게 좁았는지 살펴봅니다.","관련 기술: 놀랐을 때 멈추기, 안전하게 거리 두기, 불편함을 말로 표현하기, 상대의 설명을 듣거나 교사에게 확인을 요청하기를 배웠는지 확인합니다.","성인 지원의 역할: 교사의 개입으로 학생이 어떤 도움을 얻는지 살핍니다. 보호나 상황 확인이 필요한 요청을 단순히 관심을 끄는 행동으로 해석하지 않습니다."],"rintro":"학생의 상태와 기능 가설에 따라 필요한 행동부터 가르칩니다. 흥분이 높은 상황에서는 상대의 의도를 확인하는 대화보다 안전한 거리 확보와 도움 요청을 우선합니다.","repl":[{"beh":"접촉이나 가까운 거리가 불편할 때 친구를 밀지 않고 안전한 방향으로 한 걸음 물러나 “조금 떨어져 줘”라고 말하기 — 접촉·접근에서 벗어나는 회피·도피 기능 가설에 대응","teach":"바닥 표시나 그림을 활용하여 멈추기–거리 확보하기–말로 요청하기를 연습함. 실제로 몸을 부딪히지 않고 모의 상황으로 진행함","rein":"요청하면 교사가 필요한 거리를 확보하도록 돕고, 안전하게 공간을 요청한 행동을 구체적으로 칭찬함"},{"beh":"상황이 불분명할 때 안정된 상태에서 “방금 부딪혀서 놀랐어. 어떻게 된 거야?”라고 묻거나 교사에게 확인을 요청하기","teach":"상황 그림과 역할극으로 관찰한 사실 말하기–설명 듣기–필요하면 교사에게 알리기를 연습함","rein":"요청에 따라 설명을 듣거나 교사의 중재를 받을 기회를 제공하고, 확인을 요청한 행동을 인정함"},{"beh":"화가 나서 친구와 대화하기 어려울 때 “선생님, 잠깐 떨어져 있을 수 있게 도와주세요”라고 말하거나 약속한 신호 보내기 - 불편한 접촉·접근에서 벗어나는 회피·도피 기능 가설에 대응","teach":"교사가 있는 위치 확인하기, 도움 요청 신호 사용하기, 안전한 곳에서 기다리기를 짧게 반복 연습함","rein":"요청에 신속하게 반응하여 안전한 거리를 확보하고 필요한 도움을 제공함. 적절하게 도움을 요청한 행동을 인정함"}],"s1":[["b","교실 출입, 급식 줄, 체육활동 등에서 친구와 간격을 유지하고 주변을 살피며 이동하는 방법을 실제 장소에서 연습합니다."],["b","실수로 부딪혔을 때에는 멈추고 상대의 상태를 확인한 뒤 “미안해. 괜찮아?”라고 말하는 방법을 가르칩니다."],["b","접촉을 받은 학생에게는 상대를 밀거나 욕설하는 대신 안전하게 거리 두기, 불편함 말하기, 도움 요청하기를 가르칩니다."],["b","상대의 의도를 바로 단정하지 않고 상황을 확인하는 연습을 하되, 반복되는 접촉이나 괴롭힘이 의심되면 교사에게 알리도록 안내합니다."],["b","주변 학생에게는 몰려들거나 웃고 부추기지 않고, 공간을 확보하며 교사에게 도움을 요청하도록 가르칩니다."],["b","안전하게 이동하거나 말로 불편함을 표현하고 도움을 요청한 행동을 구체적으로 칭찬합니다."],["q","“몸이 부딪히면 놀라거나 아플 수 있어요. 먼저 멈추고 안전하게 거리를 두어요. ‘조금 떨어져 줘’라고 말할 수 있고, 어떻게 된 일인지 모르겠거나 불안하면 선생님에게 도움을 요청해요.”"]],"s2":[["b","학생과 개별적으로 접촉 상황에서 무엇이 불편한지, 어떤 도움을 받으면 좋을지 확인합니다. 필요하면 이동 간격·출입 순서·줄 위치 등을 조정하여 예상하지 못한 접촉을 줄입니다."],["b","활동 전에 ‘멈추기–거리 두기–도움 요청하기’ 중 그날 연습할 행동을 확인하고, 짧은 시범과 역할극으로 연습합니다."],["b","접촉 직후 목소리가 커지거나 친구에게 빠르게 다가가는 모습이 보이면 약속한 비언어적 신호와 짧은 말로 거리 확보를 안내합니다."],["b","밀치기가 나타나면 두 학생과 주변 학생의 안전을 우선 확보하고, 다친 곳이 있는지 확인합니다. 흥분한 학생에게 가까이 다가가거나 갑자기 접촉하기보다 안전거리를 유지하며 차분히 안내합니다."],["q","“지금은 서로 떨어져 있자. 선생님이 다친 곳이 있는지 확인할게. 이야기는 한 명씩 들을 거야.”"],["b","“친구가 일부러 그런 게 아니잖아”라고 즉시 설득하거나 두 학생 앞에서 잘잘못을 따지지 않습니다. 충분히 안정된 뒤 각각의 설명과 관찰 사실을 확인합니다."],["b","학생이 놀라거나 불편했던 경험은 인정하면서, 밀치기·욕설 대신 사용할 행동을 짧게 설명하고 다시 연습합니다."],["q","“부딪혔을 때 어떤 일이 있었다고 생각했니? 놀라거나 아팠다면 말해 줘. 친구를 밀면 다른 사람이 다칠 수 있어. 다음에는 한 걸음 물러나 ‘조금 떨어져 줘’라고 말하거나 선생님에게 알려주자.”"],["b","적절하게 거리를 요청하거나 교사에게 알린 경우 즉시 필요한 도움을 제공합니다. 상황이 정리되면 학생의 상태에 맞게 활동 복귀를 지원합니다."],["q","“방금 친구를 밀지 않고 한 걸음 물러나 도움을 요청했구나. 안전하게 알려줬어. 선생님이 어떻게 된 일인지 함께 확인할게.”"]],"s3":[["b","이동·놀이 활동 전에 신체적 간격 유지, 접촉 시 멈추기, 불편함 표현하기, 도움 요청하기를 안내합니다."],["b","밀치거나 욕설하는 행동이 나타나면 안전을 위해 서로 거리를 두고 활동을 잠시 멈춘 뒤, 교사가 각각 상황을 확인한다는 점을 미리 설명합니다."],["b","적절한 거리 확보와 보호는 행동을 잘했을 때만 제공하는 보상이 아닙니다. 공격행동이 발생한 경우에도 필요한 안전 지원을 제공하고, 평소에는 말이나 신호를 통한 요청이 빠르게 도움으로 이어지도록 합니다."],["b","친구에게 반복해서 사과하거나 학생을 직접 달래도록 맡기지 않습니다. 교사가 상황을 확인하고, 안정된 뒤 필요한 책임 있는 행동과 관계 회복을 지도합니다."],["b","접촉이 일어난 장소·과정과 실제 발화를 기록하고, 밀치기·욕설·뒤따라가기를 구분하여 점검합니다. 접촉 상황의 기회 수와 그중 거리 두기·도움 요청을 사용한 횟수, 스스로 했는지 교사의 신호가 필요했는지도 확인합니다."],["b","행동이 반복되면 실제 또래 갈등, 이동 환경, 기능 가설, 대체행동 교수와 강화의 실행 여부를 검토하고 필요한 집중지원을 계획합니다."],["b","안전 위협이 크거나 기존 지원으로 충분한 변화가 나타나지 않으면 관련 교사·보호자·전문인력과 협의하여 개별화된 행동지원과 안전대응 계획을 마련합니다."],["q","“부딪혀서 불편하면 ‘조금 떨어져 줘’라고 말하거나 선생님에게 알려줘. 선생님이 거리를 확보하고 상황을 확인할게. 밀치거나 욕설하면 안전을 위해 활동을 잠시 멈추고, 마음이 가라앉은 뒤 다시 참여하는 방법을 정할 거야.”"]],"caution":"친구와 몸이 부딪혀 느끼는 놀람이나 불편함은 인정하되, 상대가 일부러 그랬다고 단정하거나 학생의 해석을 즉시 부정하지 않습니다. 밀치기와 욕설이 나타나면 안전한 거리를 확보하고, 안정된 뒤 실제 상황과 학생의 해석을 구분하여 확인합니다. “방금 부딪혀서 놀랐어. 어떻게 된 거야?”라고 묻거나, 대화하기 어려울 때 교사에게 도움을 요청하는 방법을 연습합니다. 반복적인 신체 접촉이나 괴롭힘이 있었는지도 살피며, 상황 확인과 도움 요청에 실제로 반응하고 안전하게 거리를 유지한 행동을 강화합니다.","types":["physical","verbal"],"fns":["회피·도피"],"kw":["부딪힘","일부러","밀치기","욕설","급식 줄","이동","신체 접촉"],"situ":["신체 접촉","쉬는 시간"],"safety":true},{"id":"a4","cat":"aggr","no":4,"lvText":"중등","lv":["중"],"t":"강박 성향으로 촉발되는 괴성, 욕설, 자해(머리 박기) 및 무단 이탈 행동","scene":"쉬는 시간 동안 다른 학생들이 장난을 치다가 자신의 물건을 바닥에 떨어뜨렸다. 다음 수업이 시작된 후 바닥에 떨어진 상태의 물건을 확인하고 곧바로 괴성과 함께 거친 욕설을 내뱉었다. 이를 걱정하며 말리거나 다가오는 친구를 거칠게 밀치며 욕설과 함께 위협적인 언행을 하였다. 결과적으로 교실 분위기가 얼어붙고, 당황한 주변 친구들과 교사가 학생을 진정시키려 애쓰며 수업 진행이 일시 중단되었다.","abc":[{"r":"1회차(9/3)","a":"쉬는 시간 동안 다른 학생들이 장난을 치다가 자신의 물건을 바닥에 떨어뜨림.","b":"떨어진 물건을 확인하고 곧바로 괴성과 함께 거친 욕설을 내뱉음. 말리거나 다가오는 친구를 거칠게 밀치며 욕설을 함.","c":"교실 분위기가 순식간에 얼어붙고, 당황한 주변 친구들과 교사가 학생을 진정시키려 애쓰며 수업 진행이 일시 중단됨."},{"r":"2회차(9/8)","a":"전 시간에 제출하지 못한 활동지를 다음 교과 시간에 즉시 가져다주어야 한다고 집요하게 요구하다가 교사의 제지를 받음.","b":"참지 못하고 괴성과 욕설을 내뱉으며, 자신의 책상에 머리를 수차례 박는 자해 행동을 보임.","c":"교과 수업이 완전히 중단되고, 교사와 주변 학생들이 놀라 학생의 자해를 제지하며 진정시키는 데 집중함."},{"r":"3회차(9/15)","a":"자리를 바꾸는 제비뽑기에서 기존 자리와 같은 자리를 뽑아 자리를 바꾸지 못하게 됨.","b":"제비뽑기로 자리가 바뀌지 않자 괴성과 욕설을 내뱉고 학교 밖으로 무단 이탈함.","c":"학교 안전 및 학생 이탈 상황이 발생하여 담임교사와 생활안전부장이 즉시 뒤쫓아 학생을 안전하게 확보하고 보호자에게 연락하는 등 비상 대응이 이루어짐."}],"target":"물건 위치, 정해진 절차, 학급 규칙 등이 예상과 다르게 어그러진 상황에서 ‘괴성과 거친 욕설을 내뱉는 행동’, ‘자신의 머리를 책상에 박는 자해 행동’, ‘친구를 밀치는 공격행동’, ‘교실 및 학교 밖으로 무단 이탈하는 행동’으로 정합니다. 촉발 상황의 유형, 욕설 및 위협 표현, 자해 부위 및 횟수, 이탈 경로와 행동 직후 환경적 반응을 구체적으로 기록합니다.","hyp":["○○의 행동은 자신의 물건 위치, 정해진 절차와 반납 시간, 학급 규칙 등이 예상과 다르게 어그러질 때 나타났습니다. 1·2회차에서는 행동 직후 수업이 중단되고 교사와 또래의 관심 및 수습 반응이 집중되었으며, 3회차에서는 학교 밖으로 이탈하여 규칙 상황에서 완전히 벗어났습니다. 이러한 기록을 볼 때, 극심한 불안과 통제 상실감을 유발하는 자극에서 벗어나려는 ‘회피·도피 기능’과, 주변 상황 및 타인을 통제하려는 ‘힘·통제(요구) 기능’이 복합적으로 작용하고 있을 가능성이 높습니다. 그 기저에는 강박 성향, 인지적·정서적 유연성 부족, 좌절 상황에서의 충동 조절 미숙이 자리 잡고 있는 것으로 추정되며, 추가 면담과 관찰을 통해 상황별 주 기능을 구분하여 접근합니다."],"causes":["회피·도피 기능: 물건 위치 변동, 규칙 어긋남 등 예상치 못한 변화에서 오는 감각적·심리적 과부하와 불편한 상황에서 즉시 벗어나려는지 확인합니다.","힘·통제(요구) 기능: 과격한 분노 표출을 통해 주변 사람들의 예외적 허용을 유도하거나 자신의 원칙을 강철처럼 관철하려 하는지 살핍니다.","강박 성향 및 감정조절 미숙: 완벽주의적 고착이나 정리 정돈의 틀이 깨질 때 급격히 치솟는 불안을 안전하게 완화하는 내적 조절 기술이 결여되어 있는지 점검합니다.","대인관계 및 대처 기술 부족: 요구가 수용되지 않거나 제지당할 때 말로 타협하거나 도움을 요청하는 대안적 의사소통 기술을 습득했는지 확인합니다."],"rintro":"","repl":[{"beh":"불안이 치솟을 때 지정된 공간으로 대피하기 (극심한 불안 및 통제 불능 상황에서의 회피·도피 기능 대응)","teach":"평온한 상태에서 신체적 불안 신호(가슴 두근거림, 호흡 가빠짐)를 스스로 인식하기 — 사전 약속된 ‘잠깐 쉼표 카드’ 들어 보이기 — 조용한 진정 공간(Wee클래스 또는 교실 내 안정 구역)으로 이동하기의 3단계를 모의 상황으로 반복 연습합니다.","rein":"카드를 제시하거나 적절하게 요청하면 즉시 안전한 진정 장소로 이동을 승인하고, 공격이나 자해 대신 대피 절차를 선택한 행동을 구체적으로 칭찬합니다."},{"beh":"예상치 못한 변화 발생 시 감정 표현하기 (“계획이 바뀌어서 당황스러워요”라고 말하기 — 힘·통제 및 정서 조절 기능 대응)","teach":"자신의 물건 위치나 학급 규칙이 변동되었을 때 심호흡을 3회 실시하고, 문장 틀 카드(“지금 ~가 바뀌어서 불안해요. 다시 확인해 주세요”)를 활용해 교사에게 차분히 말하는 대화법을 역할극으로 지도합니다.","rein":"불만을 과격한 행동 대신 언어로 전달했을 때 교사가 즉시 경청하며, 규칙 내에서 가능한 대안(순서 조정, 물건 재확인 등)을 함께 협의할 기회를 제공합니다."},{"beh":"타인과의 갈등 상황에서 안전거리 확보 및 중재 요청하기 (“친구를 밀지 않고 한 걸음 물러나 교사에게 알리기” — 공격행동 예방 및 의사소통 기능 대응)","teach":"친구가 물건을 건드리거나 부딪혔을 때 즉각 반격하지 않고 ‘멈추기 — 두 걸음 뒤로 물러서기 — “선생님, 확인해 주세요”라고 도움 요청하기’ 행동을 시각적 행동 카드로 훈련합니다.","rein":"신체적 물리력(밀치기, 위협)을 행사하지 않고 교사에게 도움을 요청한 즉시 신속하게 상황을 중재해 주고, 안전한 대처 행동을 인정하고 강화합니다."}],"s1":[["b","학급 전체에 “계획이나 규칙은 상황에 따라 유연하게 바뀔 수 있다”는 회복 탄력성 규범을 안내하고, 돌발 상황 대처법을 공유합니다."],["b","타인의 물건을 실수로 건드렸을 때 즉시 사과하고 제자리에 놓는 배려 대화법 및 행동 수칙을 역할극으로 지도합니다."],["b","예상치 못한 일정 변경이나 결과 앞에서도 차분하고 융통성 있게 대처한 학생 및 모둠을 학급 전체 앞에서 구체적으로 칭찬하고 강화합니다."],["b","교실 내 급작스러운 자리 배치나 규정 변경이 있을 경우, 사전에 시각적 시간표 및 예고 알림판을 통해 변동 가능성을 미리 공지합니다."],["q","“계획대로 되지 않거나 실수가 생기면 당황스럽고 화가 날 수 있어요. 그럴 때는 소리를 지르거나 거칠게 행동하는 대신, 먼저 심호흡을 하고 ‘도움이 필요해요’라고 말해요. 서로 배려하며 차분하게 대안을 찾아봅시다.”"]],"s2":[["b","학생의 강박 성향을 자극하는 요인(특정 자리, 물건 배치, 시간 마감 등)을 미리 파악하여 일정 변경 시 1:1로 사전 예고(Previewing)합니다."],["b","불안이 올라와 신체적 긴장(주먹 쥐기, 숨 가쁨 등)이 관찰되면, 사전에 약속한 비언어적 신호(쉼표 카드 제시, 책상 가볍게 두드리기)로 호흡과 쉼을 유도합니다."],["b","괴성과 욕설이 시작되면 주변 학생들과의 거리를 확보하고, 교사는 낮고 차분하며 단호한 목소리로 짧게 지시하여 감각적 자극을 최소화합니다."],["b","머리 박기(자해)가 발생하면 쿠션이나 책가방 등을 신속히 받쳐 신체적 부상을 막고, 무단 이탈 시도를 차단하기 위한 이동 동선 안전망을 즉시 가동합니다."],["b","흥분이 가라앉을 때까지 훈계나 논쟁을 하지 않으며, 안정을 찾은 뒤에 대체행동을 다시 확인하고 짧게 연습시킵니다."],["q","“네 마음대로 되지 않아 많이 답답하고 화가 났구나. 하지만 욕설을 하거나 머리를 박는 행동, 밖으로 뛰쳐나가는 행동은 너를 다치게 해. 다음에는 마음이 힘들 때 손을 들고 ‘잠깐 상담실에 다녀오겠습니다’라고 말해보자. 안전하게 쉴 수 있게 도와줄게.”"]],"s3":[["b","학기 초/활동 전에 규칙의 변동 가능성과 긴급 진정 절차, 적절한 요청 시 제공되는 지원을 명확히 안내합니다."],["b","위협적인 욕설, 자해, 무단 이탈이 발생하더라도 학생의 비합리적 요구를 들어주거나 학급 규칙의 예외를 일방적으로 허용하지 않는다는 결과를 명시합니다."],["b","자해나 무단 이탈 등 고위험 위기 행동 발생 시의 분리 및 보호 조치는 대체행동 성공 여부와 관계없이 학생 안전을 위해 즉각 집행합니다."],["b","괴성·자해·이탈 행동의 발생 횟수와 함께, 불안 상황에서 사전 예고를 수용한 횟수 및 쉼 카드를 자발적으로 사용한 빈도를 객관적으로 기록·누적합니다."],["b","위기 행동이 지속될 경우 담임 단독 지도를 지양하고 위기행동관리팀 가동, 전문상담(Wee 클래스), 보호자 상담 및 외부 전문 치료 연계를 즉시 진행합니다."]],"caution":"강박 성향과 자해·무단 이탈이 동반되는 사례는 고의적 반항이 아니라 ‘신경학적·정서적 과부하에서 오는 통제 불능 및 도피 상태’로 접근해야 합니다. 강압적인 통제나 설득은 뇌의 각성을 높여 행동을 악화시키므로, 사전에 변동 사항을 시각적으로 안내하고 자극을 낮추는 환경적 지원과 안전 확보 체계를 우선 구축합니다.","types":["verbal","crisis","physical"],"fns":["회피·도피","원하는 것 얻기"],"kw":["강박","괴성","욕설","자해","머리 박기","무단 이탈","자리 바꾸기","규칙"],"situ":["예상치 못한 변화","쉬는 시간"],"safety":true},{"id":"a5","cat":"aggr","no":5,"lvText":"중등","lv":["중"],"t":"조별 학습 활동 시간에 조원과 언쟁하는 도중 몸싸움을 하는 행동","scene":"수업 시간에 조별 활동이 진행되던 중, 한 학생이 자신의 의견과 맞지 않는 친구와 언쟁을 벌이다가 감정이 격해져 몸싸움을 시작한다. 두 학생은 서로의 의견을 고집하며 상대방을 밀치고 위협적인 행동을 보여 교실 내 긴장감이 고조되고 수업이 중단된다.","abc":[{"r":"1회차(9/2)","a":"모둠별 역할 분담 중, 자신이 원하는 특정 역할을 다른 학생이 맡게 됨.","b":"짜증을 내며 \"왜 네가 하냐\"며 언성을 높이고 펜을 집어던짐.","c":"분위기가 험악해지고 조원들이 눈치를 보며 해당 역할을 양보함."},{"r":"2회차(9/7)","a":"의견 조율 과정에서 모둠원이 자신의 주장이 틀렸다고 반박함.","b":"상대방에게 욕설을 섞어 비난하고 의자를 발로 참.","c":"언쟁이 벌어지고 조별 활동이 일시적으로 중단됨."},{"r":"3회차(9/13)","a":"조별 결과물을 작성하던 중, 친구가 실수로 자신의 필기를 지움.","b":"격분하여 상대방의 멱살을 잡고 거칠게 밀치며 몸싸움을 시도함.","c":"주변 학생들이 소리를 지르고, 교사가 긴급히 개입하여 학생들을 물리적으로 분리함."}],"target":"모둠 활동 중 의견 대립이나 원치 않는 상황 발생 시 '물건(펜, 의자)을 던지거나 차는 행동', '욕설을 섞어 비난하는 행동', '멱살을 잡고 밀치는 신체적 공격행동'으로 정합니다. 촉발 상황의 유형, 언어적·물리적 공격의 수위, 행동 직후 또래의 반응 및 교사 개입 양상을 구체적으로 기록합니다.","hyp":["○○의 과격한 언쟁 및 몸싸움 행동은 타인과 의견이 대립하거나 자신이 원하는 것을 얻지 못했을 때 느끼는 분노를 통제하지 못해 발생합니다. 이는 갈등 상황에서 적절한 대화 기술을 사용하는 대신 폭력적인 방식을 통해 상황을 자신의 뜻대로 통제하려는 '힘·통제 기능'과 특정 역할이나 우위를 선점하려는 '요구 획득 기능'이 복합적으로 작용한 것으로 추정됩니다. 그 기저에는 효과적으로 의견을 전달하고 수용하는 의사소통 능력의 미숙과 충동 조절의 어려움이 자리 잡고 있습니다."],"causes":["의사소통 미숙 및 감정적 갈등: 자신의 의견이 존중받지 못한다고 느낄 때 서운한 마음을 말로 표현하는 능력이 부족하여 폭발적인 행동으로 드러나는지 확인합니다.","충동 조절 문제: 감정이나 충동 조절에 어려움을 겪어, 갈등 상황에서 즉각적으로 폭력적이고 공격적인 행동을 선택하는 경향이 있는지 점검합니다.","힘·통제 기능: 위협적인 행동을 통해 상대방을 굴복시키고 모둠 활동 내에서 주도권을 차지하려는지 살핍니다."],"rintro":"","repl":[{"beh":"'나 전달법(I-message)'으로 감정 표현하기 (주도권 확보 및 힘·통제 기능 대응)","teach":"\"네가 ~라고 말해서(행동해서), 나는 ~게 느껴져. ~해 주었으면 좋겠어\"라는 문장 틀을 시각자료로 제공하고 평상시 모의 상황에 대한 역할극을 통해 충분히 연습시킵니다.","rein":"위협 대신 언어로 불만을 표현했을 때 즉시 경청하며, 학생의 의견을 모둠 활동에 일부 반영할 수 있도록 중재하여 긍정적 의사소통의 효능감을 강화합니다."},{"beh":"감정이 격해질 때 '타임아웃' 요청하기 (충동 조절 및 공격행동 예방 대응)","teach":"신체적 분노 신호(얼굴 붉어짐, 근육 긴장)를 인식하고, 폭발 전 \"물 마시고 오겠습니다\" 또는 사전 약속된 수신호로 잠시 자리를 피하는 3단계를 지도합니다.","rein":"안전하게 상황을 이탈한 행동을 칭찬하고, 교실 밖이나 지정된 공간에서 감정을 가라앉힐 수 있는 짧은 휴식 시간을 보장합니다."},{"beh":"물리적 접촉 전 교사에게 중재 요청하기 (의사소통 미숙 및 요구 획득 기능 대응)","teach":"멱살을 잡거나 물건을 던지기 전 '두 걸음 뒤로 물러서기 — 손들기 — 선생님께 도움 요청하기' 절차를 시각적 행동 카드로 훈련합니다.","rein":"물리력을 행사하지 않고 교사를 호출한 즉시 신속하게 다가가 상황을 중재해 주고, 평화로운 문제 해결 시도를 구체적으로 인정합니다."}],"s1":[["b","조별 활동이 진행될 것임을 미리 알려 학생들이 활동을 계획하고 준비를 할 수 있도록 합니다."],["b","조별 활동 전 서로를 존중하는 태도와 명확한 역할 선정 규칙을 안내합니다."],["b","타인의 의견을 반박할 때 사용할 수 있는 정중한 거절 및 제안의 대화 수칙을 학급 전체에 역할극으로 지도합니다."],["b","\"각자 의견을 표현하는 건 좋지만, 상대를 비난하거나 공격하는 방법은 존중하지 않는 행동일 수 있다는 것을 기억하세요\"라고 강조합니다."]],"s2":[["b","다툼이 발생하면 교사는 두 학생 사이로 빠르게 이동하여 상대방을 바라보지 않도록 차단하고, 번갈아 눈 맞춤을 하며 손을 펴서 진정하라는 제스처를 취합니다."],["b","불안이 올라와 신체적 긴장(주먹 쥐기, 숨 가쁨 등)이 관찰되면, 사전에 약속한 비언어적 신호(쉼표 카드 제시, 책상 가볍게 두드리기)로 호흡과 쉼을 유도합니다."],["b","짧고 명확한 문장과 차분한 어조로 \"조별 활동에서 중요한 것은 수업 목표와 관련된 활동을 완성하는 거야. 다투는 지금의 행동은 적절하지 않아. 숨을 고르며 감정을 가라앉히자\"라고 지도한다."],["b","흥분이 가라앉은 후, '나 전달법' 문장 틀을 활용하여 상대방에게 서운했던 점을 차분히 말해보도록 짧게 연습시킵니다."]],"s3":[["b","갈등 상황에서 다툼 대신 심호흡을 하거나 교사에게 질문하여 문제를 평화롭게 해결할 경우 즉각적인 긍정적 피드백을 제공합니다."],["b","어떠한 경우에도 신체적 폭력이나 위협적인 행동은 허용되지 않으며, 발생 시 즉각적인 분리 조치 및 성찰문 작성 단계로 넘어감을 학기 초에 명확히 안내합니다."],["b","교사의 제지에도 불구하고 수업 진행이 어려울 정도로 흥분을 가라앉히지 못하고 몸싸움을 지속한다면, \"수업에 참여하기 어려울 정도로 진정되지 않는다면 학교생활규정에 따라 교실 밖으로 분리되어 네 행동에 관해 성찰하는 시간을 가져야 해\"라고 후속 조치를 예고 및 실행한다."]],"caution":"모둠활동은 수업 목표 달성을 위한 과정이므로, 학생이 화를 내거나 폭력을 행사하는 것이 학습 목표에 저해된다는 점을 명확히 인식시켜야 합니다. 또한, 논리적이지 않거나 지나치게 공격적인 어투로 훈육하는 것은 지양하며, 교사는 시종일관 차분한 어조로 대응하는 것이 중요합니다.","types":["physical","verbal"],"fns":["원하는 것 얻기"],"kw":["조별","모둠","언쟁","몸싸움","역할","반박","주도권"],"situ":["모둠활동","의견 대립"],"safety":true},{"id":"s1","cat":"smart","no":1,"lvText":"초등","lv":["초"],"t":"단체채팅방에서 원치 않는 연락을 반복하고, 특정 친구를 배제하거나 괴롭히는 행동","scene":"방과 후 친구들이 참여하는 단체채팅방에서 한 학생이 특정 친구에게 메시지와 통화 요청을 반복하며 답변을 요구하였다. 친구가 “연락하지 마. 이 방에도 들어오고 싶지 않아”라고 말하고 대화방을 나갔지만, 학생은 다시 초대하거나 초대 링크를 보내며 참여를 요구하였다. 이후 ‘우리 모둠에서 빼고 싶은 친구’를 고르는 투표를 만들고 다른 학생들에게 참여하라고 말했다. 또 “OO가 말해도 답하지 마”라고 요구하고, 해당 친구에게 답한 학생에게도 “왜 걔 편을 들어?”라고 비난하였다. 해당 친구는 다음 날 교사에게 대화 내용을 보여주며 도움을 요청하였다.","abc":[{"r":"1회차(8/2)","a":"친구가 “연락하지 마. 이 방에도 들어오고 싶지 않아”라고 말하고 단체채팅방을 나감.","b":"같은 친구에게 메시지와 통화 요청을 반복해서 보내고, 다시 초대하거나 초대 링크를 보내며 답변과 참여를 요구함.","c":"같은 친구에게 메시지와 통화 요청을 반복해서 보내고, 다시 초대하거나 초대 링크를 보내며 답변과 참여를 요구함."},{"r":"2회차(8/5)","a":"같은 친구에게 메시지와 통화 요청을 반복해서 보내고, 다시 초대하거나 초대 링크를 보내며 답변과 참여를 요구함.","b":"같은 친구에게 메시지와 통화 요청을 반복해서 보내고, 다시 초대하거나 초대 링크를 보내며 답변과 참여를 요구함.","c":"같은 친구에게 메시지와 통화 요청을 반복해서 보내고, 다시 초대하거나 초대 링크를 보내며 답변과 참여를 요구함."},{"r":"3회차(8/8)","a":"단체채팅방에서 한 학생이 배제 대상으로 지목된 친구의 질문에 답함.","b":"“OO가 말해도 답하지 마”라고 요구하고, 답한 학생에게 “왜 걔 편을 들어?”라고 비난함.","c":"답한 학생이 “알겠어”라고 말한 뒤 대화를 멈춤. 지목된 친구가 다음 날 교사에게 대화 내용을 보여주며 도움을 요청함."}],"target":"관찰할 문제행동은 ‘친구가 거절했는데도 연락이나 단체채팅방 초대를 반복하는 행동’, ‘특정 친구를 부정적으로 평가하거나 배제하는 투표를 만들어 게시하는 행동’, ‘다른 학생들에게 특정 친구에게 답하지 말라고 요구하거나 그 친구와 대화하는 학생을 비난하는 행동’으로 구분하여 정합니다. 각 행동별로 실제 메시지와 투표 내용, 연락·초대·게시 횟수, 상대의 거절 표현, 행동 직후의 반응을 구체적으로 기록합니다.","hyp":["OO의 행동은 온라인에서 친구가 답변이나 참여를 거절하거나, 또래 간 대화가 자신이 원하는 방향으로 이루어지지 않는 상황에서 나타납니다. 원치 않는 연락과 초대를 반복한 뒤 상대가 답하거나, 평가·배제 투표를 게시한 뒤 친구들이 투표하고 반응하며, 특정 친구에게 답하지 말라고 요구한 뒤 일부 학생이 그 친구와의 대화를 중단하는 결과가 관찰된다면, 이러한 결과가 행동의 반복과 관련되는지 살펴볼 수 있습니다. 따라서 이 행동은 또래의 관심과 반응을 얻는 기능과 상대의 답변이나 다른 학생들의 동조 등 자신이 원하는 반응을 얻는 기능을 수행할 가능성이 있습니다. 다만 연락·초대 반복, 평가·배제 투표, 대화 배제 요구는 행동의 형태와 후속결과가 다를 수 있으므로, 각 행동의 ABC 관찰기록과 학생 면담을 통해 기능 가설을 개별적으로 점검합니다. 관계에서 느끼는 불안이나 소외감은 관련 배경으로 살펴보되, 관찰된 사실만으로 단정하지 않습니다."],"causes":["관심 획득 기능: 반복 연락 뒤 답변을 받거나, 투표 게시 뒤 또래가 참여하고 이야기하는 결과가 행동을 유지시키는지 살펴봅니다.","요구·획득 기능: 연락을 통해 특정 활동에 참여시키려는 것인지, 대화 금지 요구로 다른 학생들의 행동을 바꾸려는 것인지 구체적인 요구와 결과를 확인합니다.","관련 기술: 연락에 대한 동의 확인, 거절 수용, 답변이 없을 때 다른 활동 선택, 서운함 표현, 공동 활동의 의견 조율 방법을 충분히 배웠는지 확인합니다.","또래관계: 특정 친구에게 행동이 집중되는지, 다른 학생이 배제 요구에 동조하거나 비난을 피하려고 따르는지, 오프라인의 놀이·모둠활동에서도 배제가 이어지는지 살펴봅니다."],"rintro":"","repl":[{"beh":"친구가 연락이나 참여를 거절하면 추가 연락·초대를 멈추고, 교사·보호자 또는 대화에 동의한 사람에게 “이야기하고 싶어요”라고 요청하기 — 다른 적절한 경로로 관심을 얻는 기능에 대응","teach":"‘거절 확인하기–연락·초대 멈추기–다른 활동이나 도움 요청 선택하기’를 역할극으로 연습함. 이미 거절한 친구에게 다시 확인 연락을 보내도록 요구하지 않음","rein":"적절한 요청에 성인이 경청하고 필요한 도움을 제공함. 상대의 거절을 존중하고 다른 방법으로 소통한 행동을 구체적으로 칭찬함"},{"beh":"사람을 평가·배제하는 투표 대신, 참여자가 동의한 놀이·활동 주제로 의견 묻기 — 적절한 방식으로 또래의 관심과 참여를 얻는 기능에 대응","teach":"‘빼고 싶은 친구 고르기’와 ‘함께 하고 싶은 활동 고르기’를 비교하고, 특정 학생을 겨냥하지 않는 질문을 만들어 연습함","rein":"안전한 주제로 의견을 물었을 때 교사가 반응하고, 동의한 학생들과 의견을 나누고 활동을 정할 기회를 제공함"},{"beh":"친구 관계나 공동 활동에 불만이 있을 때 “나는 이 점이 불편해. 함께 방법을 정하고 싶어”라고 말하거나 교사에게 중재 요청하기 — 배제 요구 대신 의견을 제시하고 협의하는 방법을 교수","teach":"‘불편한 점 구체적으로 말하기–상대 의견 듣기–공통 규칙으로 결정하기’를 연습함. 자신의 요구가 받아들여지지 않을 때 다른 활동을 선택하거나 도움을 요청하는 방법도 가르침","rein":"의견을 듣고 공정하게 협의할 기회를 제공하며, 다른 학생의 선택을 존중한 행동을 칭찬함. 특정 친구를 배제하거나 다른 학생의 대화를 막아 주는 결과는 제공하지 않음"}],"s1":[["b","학급 전체에 ‘연락이나 대화방 참여를 거절하면 멈추기’, ‘다른 사람을 평가·배제하는 투표 만들지 않기’, ‘특정 친구에게 답하지 말라고 요구하지 않기’를 기대행동으로 안내합니다."],["b","대화방에 참여하거나 메시지에 답하는 것은 상대의 의사와 상황을 존중해야 함을 설명합니다. 답변이 없다는 이유로 반복 연락하거나 비난하지 않도록 가르칩니다."],["b","놀이·활동에 대한 의견을 묻는 투표와 특정 친구를 놀리거나 제외하는 투표를 비교하고, 적절한 질문 만들기를 연습합니다."],["b","배제 요구를 받았을 때 “나는 필요한 말은 할 거야”, “친구를 빼는 투표에는 참여하지 않을래”라고 말하거나 교사·보호자에게 알리는 방법을 연습합니다."],["b","직접 거절하기 어렵거나 자신도 비난받을까 걱정되는 학생에게는 공개적으로 맞서도록 요구하지 않고, 개별적으로 도움받을 수 있는 방법을 안내합니다."],["b","학습에 필요한 준비물·일정은 특정 학생이 관리하는 사적 대화방에만 의존하지 않고 모든 학생이 확인할 수 있게 제공합니다."],["b","거절 존중, 배제 요구에 참여하지 않기, 필요한 정보 전달, 적절한 도움 요청을 구체적으로 칭찬합니다."],["q","“친구가 연락이나 초대를 원하지 않으면 멈춰야 해요. 누구에게 답할지는 다른 사람이 강요할 수 없어요. 친구를 빼는 투표나 대화 금지 요구를 받으면 참여하지 않고 어른에게 도움을 요청할 수 있어요.”"]],"s2":[["b","피해학생의 상태와 추가 연락·초대·배제 여부를 먼저 확인합니다. 대화방을 나갔다는 이유로 학습 정보나 필요한 활동에서 불이익을 받지 않도록 지원합니다."],["b","작성 학생에게 추가 연락·초대와 배제 요구를 멈추도록 짧고 명확하게 안내합니다. 다른 계정이나 다른 친구를 통한 연락도 포함합니다."],["b","개별 면담에서 반복 연락, 투표 게시, 대화 금지 요구를 나누어 살펴봅니다. “어떤 답을 기대했니?”, “투표 뒤에 무엇이 달라지길 바랐니?”라고 묻고 관찰자료와 함께 검토합니다."],["b","연락을 멈추기 어려울 때 사용할 ‘기기 내려놓기–다른 활동 선택하기–도움 요청하기’를 학생과 정하고 연습합니다. 필요한 경우 짧은 점검카드나 약속한 신호를 사용합니다."],["b","가상 상황으로 적절한 관심 요청, 안전한 투표 질문, 불만을 말로 표현하는 방법을 교사가 시범 보이고 학생이 직접 수행하게 합니다."],["b","다른 학생이 자신의 요구를 따르지 않더라도 비난하지 않고, 공동 규칙이나 교사의 중재를 통해 조율하도록 가르칩니다."],["b","피해학생에게 답변·대화방 복귀·직접 사과받기를 요구하지 않습니다. 관계 회복이 필요한 경우에도 당사자의 의사와 안전을 고려합니다."],["b","방과 후 행동은 보호자와 협력하여 지원하고, 거절 이후 연락을 멈추거나 적절한 도움을 요청한 행동에 구체적인 피드백을 제공합니다."],["q","“그 친구는 연락과 초대를 원하지 않는다고 말했어. 지금부터 추가 메시지와 초대를 멈추자. 다른 친구에게 대신 연락해 달라고 해도 안 돼. 하고 싶은 이야기는 선생님에게 해줘.”"],["q","“친구가 답하지 않아서 어떤 점이 힘들었니? 계속 답을 요구하는 대신 ‘이야기하고 싶어요’라고 도움을 요청할 수 있어. 친구 관계에서 불편한 점은 다른 친구들에게 답하지 말라고 시키기보다 선생님과 함께 해결 방법을 찾아보자.”"],["q","“방금 다시 초대하고 싶었지만 멈추고 도움을 요청했구나. 상대의 뜻을 존중하면서 네 마음을 적절하게 표현했어.”"]],"s3":[["b","온라인 활동 전에 연락·초대에 대한 동의, 투표 주제, 다른 학생의 대화와 관계를 존중하는 규칙을 구체적으로 안내합니다."],["b","반복 연락·초대가 나타나면 추가 접촉을 중단하고, 학생·보호자와 필요한 설정 및 점검 방법을 확인합니다. 배제 투표와 대화 금지 요구가 확인되면 참여·확산을 멈추도록 지도합니다."],["b","사실 확인에 필요한 기록은 학교의 정해진 절차에 따라 보존·관리합니다. 자료 확인을 이유로 대화 내용을 여러 학생에게 재전달하지 않습니다."],["b","피해학생의 보호와 지원은 작성 학생의 반성·사과 여부와 관계없이 제공합니다. 배제 요구에 따르도록 압박받은 학생의 어려움도 확인합니다."],["b","반복 연락·초대, 배제 투표, 대화 금지 요구·비난의 발생을 각각 기록합니다. 거절을 들은 기회 중 연락을 멈춘 경우, 적절한 관심·중재 요청, 교사의 도움 수준도 함께 점검합니다."],["b","행동이 반복되면 기능 가설, 또래의 반응, 가정의 실행 여건, 교수·강화의 실행 여부를 검토하고 행동계약·자기점검 등 필요한 집중지원을 계획합니다."],["b","특정 학생을 대상으로 괴롭힘과 배제가 이어지면 행동지원과 별도로 담당부서와 공유하여 필요한 보호와 사안 대응을 진행합니다."],["b","보호자에게는 사용시간뿐 아니라 상대의 거절을 존중하는 행동, 반복 초대 중단, 배제 요구에 참여하지 않는 행동을 중심으로 협력을 요청합니다."],["q","“친구가 거절하면 연락과 초대를 멈추는 것이 규칙이야. 친구를 빼는 투표나 답하지 말라는 요구도 중단해야 해. 이 행동이 계속되면 어른과 함께 사용 방법을 점검하고 필요한 지원을 정할 거야. 서운하거나 도움이 필요할 때는 말로 요청하면 함께 방법을 찾을 수 있어.”"]],"caution":"원치 않는 연락 또는 배제 요구를 단순한 친구 간 다툼으로 보지 않고, 상대의 거절 이후에도 행동이 반복되는지와 다른 학생에게 동조를 강요하는지 살펴봅니다. 추가 연락과 배제를 중단하도록 안내하고, 피해학생에게 답변이나 대화방 복귀를 요구하지 않습니다. 연락에 대한 동의와 거절을 존중하고, 서운함을 적절하게 표현하거나 도움을 요청하는 방법을 가르칩니다. 학생이 대화나 도움을 요청하면 이야기를 듣고 필요한 도움을 제공하며, 다른 학생에게 대신 연락하게 하거나 배제에 동참하도록 요구하는 행동이 이어지는지 확인합니다.","types":["online"],"fns":["관심 획득","원하는 것 얻기"],"kw":["단체채팅방","단톡","배제","초대","투표","연락","따돌림"],"situ":["온라인 대화"],"safety":true},{"id":"s2","cat":"smart","no":2,"lvText":"초등","lv":["초"],"t":"수업 중 공유 플랫폼에서 친구의 결과물에 비난·조롱하는 댓글을 반복해서 작성하는 행동","scene":"사회시간에 학생들이 공유 플랫폼에 모둠별 조사 결과를 게시하고 서로 의견을 남기는 활동을 하였다. 한 학생이 친구의 결과물에 “이것도 발표라고 했냐?”라는 댓글을 작성하였다. 주변 친구들이 댓글을 보고 웃자 학생은 비슷한 댓글을 추가로 작성하였다. 교사가 해당 댓글을 숨기고 작성 규칙을 안내하였지만, 학생은 표시 이름을 바꾸어 “진짜 못했다”라는 댓글을 다시 게시하였다. 댓글을 받은 학생은 화면을 닫고 활동 참여를 멈추었으며, 일부 학생은 댓글 내용을 다른 친구에게 전달하였다.","abc":[{"r":"1회차(5/8)","a":"친구들이 모둠별 조사 결과를 게시하고 서로 댓글을 작성하기 시작함.","b":"친구의 결과물에 “이것도 발표냐?”라는 댓글을 게시함.","c":"주변 친구들이 댓글을 읽고 웃음. 댓글을 받은 학생은 화면을 닫고 댓글 활동을 멈춤."},{"r":"2회차(5/15)","a":"교사가 비난성 댓글을 숨기고, 결과물의 구체적인 부분에 대해 칭찬하거나 질문하도록 안내함.","b":"표시 이름을 바꾸어 같은 친구의 게시물에 “진짜 못했다”라는 댓글을 게시함.","c":"친구들이 댓글 작성자가 누구인지 이야기함. 교사가 댓글 활동을 잠시 중단하고 학생을 개별 지도함."},{"r":"3회차(5/22)","a":"친구들이 한 모둠의 결과물에 긍정적인 댓글을 작성하고 내용을 이야기함.","b":"해당 게시물에 “이게 뭐가 잘한 거냐?”라는 댓글과 조롱하는 그림 기호를 게시함.","c":"일부 친구가 댓글을 다른 학생에게 보여주며 웃음. 댓글을 받은 학생이 교사에게 알리고 교사가 댓글을 숨김."}],"target":"관찰할 문제행동은 ‘공유 플랫폼에서 친구나 친구의 결과물을 비난·조롱하는 표현을 댓글로 게시하는 행동’으로 정합니다. 실제 표현과 게시 횟수, 댓글의 대상, 행동 직후의 반응을 구체적으로 기록합니다","hyp":["OO의 비난·조롱 댓글 게시 행동은 친구들의 결과물을 함께 보고 의견을 주고받는 상황에서 나타납니다. 행동 직후 친구들이 웃거나 댓글 내용을 이야기하고 다른 학생에게 보여주는 반응이 관찰되어, 또래의 관심과 반응을 얻는 기능이 작용할 가능성이 있습니다.","교사의 개별 지도와 댓글 활동의 중단도 뒤따르고 있으나, 이것만으로 교사의 관심 획득이나 과제 회피가 행동의 기능이라고 단정하지 않습니다. 또래의 반응, 과제의 어려움, 교사의 지원 여부에 따라 행동이 어떻게 달라지는지 추가로 관찰하고 학생 면담을 통해 기능 가설을 점검합니다."],"causes":["또래의 관심 획득: 비난·조롱하는 댓글을 작성했을 때 친구들이 웃거나 이야기하는 반응이 반복되어 행동이 유지될 가능성이 있습니다.","교사의 관심 획득 가능성: 댓글 게시 후 교사와의 개별적인 상호작용이 제공되는 결과가 행동의 반복과 관련되는지 확인합니다.","과제 회피 가능성: 댓글 작성이 어렵거나 부담스러운 상황에서 행동이 나타나고, 이후 과제가 중단되거나 면제되는지 확인합니다.","의사소통 및 자기점검 기술의 어려움: 관심을 적절하게 요청하거나, 결과물에 대한 의견을 존중하는 표현으로 전달하고 게시 전에 확인하는 기술이 충분히 습득되지 않았을 수 있습니다.","환경 및 또래관계 요인: 표시 이름 변경, 게시 전 확인 절차의 부재, 비난성 댓글에 대한 친구들의 웃음과 전달 행동 등이 영향을 줄 수 있습니다. 특정 학생을 대상으로 반복되는 경우 기존의 관계 갈등도 함께 살펴봅니다."],"rintro":"","repl":[{"beh":"친구의 결과물에서 구체적인 부분을 짚어 칭찬하거나 질문하기— 적절한 방법으로 또래의 관심과 반응 얻기","teach":"“○○ 부분이 이해하기 쉬웠어.”, “이 자료는 어떻게 찾았어?” 등 짧은 문장 틀을 제시하고 가상의 게시물로 연습한다.","rein":"적절한 표현을 구체적으로 칭찬하고, 정해진 상호 피드백 시간에 질문과 답을 주고받을 기회를 제공한다."},{"beh":"자신의 의견을 알리고 싶을 때 “내 생각도 이야기해도 될까?”라고 묻거나 정해진 순서에 의견 제시하기— 적절한 참여를 통해 또래의 관심 얻기","teach":"의견을 요청하는 표현, 차례를 기다리는 방법, 결과물과 관련된 의견을 전달하는 방법을 역할극으로 연습한다.","rein":"요청에 반응하고 실제로 의견을 제시할 차례를 제공한다. 기다려야 할 때는 언제 참여할 수 있는지 알려준다."},{"beh":"댓글 작성이 어려울 때 “어떻게 쓰면 좋을지 도와주세요”라고 요청하기— 과제 부담을 적절하게 줄이기〔회피 기능이 확인되는 경우〕","teach":"교사와 문장 틀을 선택하고 짧은 댓글 하나를 완성하는 과정을 연습한다.","rein":"도움 요청에 따라 설명이나 문장 틀을 제공하고 필요하면 분량을 조정한다. 지원받아 활동에 참여한 행동을 구체적으로 강화한다."}],"s1":[["b","공유 플랫폼 사용 전에 학급 전체가 이해할 수 있는 구체적인 기대행동을 정하고 게시합니다. 예: ‘사람을 평가하기보다 결과물의 구체적인 부분에 대해 말하기’, ‘존중하는 표현 사용하기’, ‘게시 전에 다시 읽기’"],["b","처음에는 구체적인 칭찬이나 질문 중 한 가지를 작성하도록 하고, 익숙해지면 도움이 되는 제안으로 확장합니다."],["b","가상의 댓글을 활용하여 비난·조롱과 학습에 도움이 되는 의견을 구분하고, 부적절한 표현을 바꾸어 쓰는 연습을 합니다."],["b","‘작성하기–멈추어 읽기–필요하면 수정하기–게시하기’의 순서를 시각적으로 안내하고 반복해서 연습합니다."],["b","상호 피드백의 순서와 시간을 정하여 모든 학생이 적절한 방법으로 의견을 주고받을 기회를 제공합니다."],["b","비난·조롱하는 댓글을 보았을 때 웃거나 따라 쓰거나 전달하지 않고 교사에게 알리는 방법을 가르칩니다."],["b","교사가 작성자를 확인할 수 있는 계정이나 표시 이름을 사용하고, 플랫폼의 기능에 따라 게시 전 확인 또는 댓글 권한을 설정합니다."],["b","존중하는 댓글 작성, 적절한 참여 요청, 게시 전 자기수정 행동을 구체적으로 칭찬합니다."],["q","“친구의 결과물에 의견을 남길 때는 어떤 부분에 대해 말하는지 구체적으로 써봅시다. 궁금한 점이나 다른 생각을 말할 수 있지만, 친구를 깎아내리는 표현은 사용하지 않아요. 게시하기 전에 한 번 더 읽고 필요한 부분을 고쳐봅시다.”"]],"s2":[["b","활동 전에 학생과 사용할 대체행동을 확인하고, 처음에는 짧은 댓글 한 개처럼 수행 가능한 목표를 정합니다."],["b","학생이 댓글을 작성할 때 교사가 사전에 약속한 신호나 점검카드를 제시하여 게시 전 확인을 돕습니다."],["b","비난·조롱 댓글이 게시되면 추가 노출을 줄이고 댓글을 받은 학생의 상태와 지원 필요를 먼저 확인합니다."],["b","작성 학생을 공개적으로 추궁하지 않고 별도로 대화합니다. 당시 상황과 기대했던 반응을 확인하되, “친구들이 웃어서 재미있었지?”처럼 의도를 미리 정해 묻지 않습니다. 관찰한 행동 설명–부적절한 이유 안내–적절한 표현 시범–학생의 직접 연습–강화의 순서로 지도합니다."],["b","비난성 표현을 억지로 칭찬으로 바꾸게 하기보다, 결과물에서 실제로 궁금하거나 보완이 필요하다고 생각한 부분을 구체적인 질문이나 제안으로 표현하도록 돕습니다. 필요하면 일정 기간 교사의 게시 전 확인, 문장 틀, 선택형 피드백을 활용하고, 학생이 독립적으로 수행하는 정도에 따라 지원을 줄입니다."],["b","피해학생에게 즉각적인 답변이나 공개적인 화해·사과 수용을 요구하지 않습니다."],["q","“‘진짜 못했다’는 댓글이 게시되었네. 이 말은 친구를 깎아내리는 표현이야. 결과물에서 궁금하거나 보완했으면 하는 부분이 있다면 그 부분을 구체적으로 말해보자. 선생님이 예를 보여줄게. 그다음 네가 직접 작성해보자.”"],["q","“방금은 게시하기 전에 다시 읽고 질문으로 바꾸었구나. 친구가 어떤 부분에 답하면 되는지 알 수 있도록 구체적으로 썼어.”"]],"s3":[["b","활동 전에 기대행동, 도움 요청 방법, 게시 전 확인 절차와 규칙을 지키지 않았을 때의 조치를 안내합니다."],["b","비난·조롱 댓글이 게시되면 추가 노출을 제한하고, 필요한 기록을 정해진 절차에 따라 보존·관리합니다. 피해 내용을 학급 전체에 다시 보여주며 지도하지 않습니다."],["b","댓글 게시 권한을 조정해야 할 때는 교사에게 의견을 제출하거나 확인 후 게시하는 등 안전한 참여 방법을 제공합니다. 학생이 기대행동을 수행하는 정도를 살펴 지원 수준을 조정합니다."],["b","학생과 ‘적절한 표현으로 작성하기–게시 전 확인하기–필요하면 도움 요청하기’를 점검하고, 실제로 수행한 대체행동을 강화합니다."],["b","비난·조롱 댓글 게시 횟수뿐 아니라 댓글 작성 기회 중 적절한 표현을 사용한 정도, 스스로 수정한 행동, 교사의 안내를 받아 수정한 행동을 구분하여 기록합니다."],["b","게시 제한으로 문제 댓글이 나타나지 않은 경우에는 이를 대체행동 습득으로 판단하지 않습니다. 안전하게 조정된 활동에서 적절한 표현을 사용할 수 있는지 확인합니다."],["b","행동이 반복되면 또래의 반응, 과제 난이도, 대체행동에 제공된 결과를 검토하여 기능 가설과 지원 방법을 조정합니다. 필요하면 행동계약, 자기점검, 대체행동 강화 등을 포함한 집중지원을 계획합니다."],["b","특정 학생을 대상으로 반복되거나 조롱·배제로 확산되는 경우에는 피해학생 보호와 학교의 관련 대응을 행동지원과 병행합니다. 보호자에게는 온라인 의사소통 행동과 상대 학생에게 미친 영향을 구체적으로 설명합니다."],["q","“친구를 비난하거나 조롱하는 댓글은 다른 친구들에게 계속 보이지 않도록 조치할 거예요. 그런 댓글을 작성한 경우에는 선생님과 표현을 다시 연습하고, 필요하면 확인을 받은 뒤 게시하게 됩니다. 궁금한 점이나 다른 의견은 존중하는 표현으로 말할 수 있어요.”"]],"caution":"비난·조롱 댓글이 게시되면 추가 노출과 전달을 막고, 댓글을 받은 학생의 상태를 확인하여 지원합니다. 댓글 삭제나 기기 사용 제한에 그치지 않고, 결과물의 구체적인 부분에 대해 존중하는 표현으로 질문하거나 의견을 전달하는 방법을 가르칩니다. 또래의 관심을 얻는 기능이 확인되면 적절한 댓글을 통해 안전하게 의견을 주고받을 기회를 제공하되, 피해학생에게 답글을 요구하지 않습니다. 친구들의 웃음과 재전달도 함께 지도하며, 적절한 댓글 작성과 게시 전 자기수정이 늘어나는지 확인합니다.","types":["online"],"fns":["관심 획득"],"kw":["공유 플랫폼","댓글","비난","조롱","결과물","패들렛"],"situ":["수업 중","모둠활동","지적·피드백"],"safety":false},{"id":"s3","cat":"smart","no":3,"lvText":"초등","lv":["초"],"t":"AI로 친구를 조롱하는 이미지나 허위 장면·대화를 만들어, 실제 모습이나 말인 것처럼 온라인에 게시·공유하는 행동","scene":"방과 후 친구들이 참여하는 단체채팅방에서 한 학생이 친구의 사진을 AI로 변형하여 외모를 우스꽝스럽게 표현한 이미지를 게시하였다. 일부 학생이 웃는 반응을 보이자 다른 이미지를 추가로 공유하였다. 이후 같은 친구가 다른 학생의 물건을 훔치는 것처럼 보이는 이미지를 만들어 실제로 있었던 일이라고 설명하였다. 또 친구가 다른 학생을 험담하는 내용의 가짜 대화를 AI로 작성하여, 친구가 실제로 보낸 메시지인 것처럼 전달하였다. 해당 친구는 “나는 그런 적 없어. 그만 올려”라고 말했고, 다음 날 교사에게 자신에게 전달된 자료를 보여주며 도움을 요청하였다.","abc":[{"r":"1회차(7/2)","a":"단체채팅방에서 친구들이 현장체험학습 사진을 주고받음","b":"친구의 사진을 AI로 변형한 조롱 이미지를 게시하고, 웃는 반응이 달린 뒤 다른 이미지를 추가로 올림","c":"일부 학생이 웃는 이모티콘을 보내고 “또 만들어 봐”라고 말함. 사진 속 친구는 “내 사진으로 하지 마”라고 요청함"},{"r":"2회차(7/5)","a":"단체채팅방에서 일부 친구가 학생에게 다른 AI 이미지도 보여 달라고 말함","b":"같은 친구가 다른 학생의 물건을 훔치는 것처럼 보이는 AI 이미지를 게시하고 “얘가 가져간 거야”라고 작성함","c":"일부 학생이 “진짜야?”라고 묻고 이미지를 다른 친구에게 보여줌. 해당 친구는 사실이 아니라고 설명함"},{"r":"3회차(7/8)","a":"해당 친구가 단체채팅방에서 “나는 그런 적 없어. 그만 올려”라고 말함","b":"친구가 다른 학생을 험담하는 내용의 가짜 대화를 AI로 작성하여, 실제 메시지인 것처럼 다른 학생에게 전달함","c":"전달받은 학생이 해당 친구에게 험담 여부를 따져 물음. 해당 친구가 교사에게 자료를 보여주고 도움을 요청함"}],"target":"관찰할 문제행동은 ‘AI를 활용하여 친구에게 피해를 주는 이미지나 대화내용 등을 제작하거나 공유하는 행동’으로 정합니다. 자료의 유형별로 제작과 공유를 구분하여, 확인된 내용과 대상, 게시·전달 횟수와 범위, 행동 직후의 반응을 구체적으로 기록합니다.","hyp":["OO의 조롱 이미지와 허위 장면 게시 행동 이후 친구들의 웃음, 추가 제작 요청, 질문과 재전달이 나타났으며, 이러한 반응 뒤에 이미지 게시가 이어졌습니다. 따라서 이 행동은 또래의 관심과 반응을 얻는 기능을 수행할 가능성이 있습니다. 가짜 대화 내용을 전달하는 행동은 중단 요구 이후 나타났으나, 이 사실만으로 보복 의도나 특정 기능을 단정하지 않습니다. 학생이 기대했던 반응과 전달 이후 실제로 나타난 또래의 반응 및 관계 변화를 추가로 확인합니다. 세 행동은 형태와 후속결과가 다를 수 있으므로, 각 행동의 ABC 관찰기록과 학생 면담을 통해 기능 가설을 개별적으로 점검합니다. 동일한 친구를 대상으로 행동이 반복되었다는 점을 고려하여 피해와 또래관계를 함께 살펴보되, 피해의 심각성과 행동의 기능은 구분하여 판단합니다. 기능이 명확하게 확인되지 않은 경우에도 추가 게시·전달을 막고 피해학생을 지원합니다."],"causes":["관심 획득 기능: 또래의 웃음, 질문, 추가 제작 요청, 재전달이 뒤따를 때 게시 행동이 더 자주 나타나는지 확인합니다.","원하는 활동·결과 얻기 가능성: 자료 제작을 통해 특정 놀이에 참여하거나 또래의 요구를 충족하는 등 구체적으로 얻는 결과가 있는지 살펴봅니다. ‘우월감을 느끼려 한다’는 추정만으로 기능을 정하지 않습니다.","관련 기술: 사진 사용·공유에 대한 동의 구하기, 사실과 생성된 내용을 구분하기, 자신의 창작물을 설명하기, 상대의 중단 요구를 수용하기를 충분히 배웠는지 확인합니다.","또래관계와 환경: 특정 친구를 대상으로 한 기존의 놀림·배제가 있었는지, 다른 학생이 제작을 요구하거나 재전달에 참여하는지 살펴봅니다."],"rintro":"","repl":[{"beh":"친구의 사진 대신 자신의 그림이나 가상의 인물로 창작하고 “내가 만든 작품을 봐줄래?”라고 요청하기 — 적절한 방식으로 관심을 얻는 기능에 대응","teach":"교사가 허용한 활동에서 실존 친구를 소재로 하지 않는 창작물을 준비하고, 작품 소개·감상 요청 표현을 시범 보인 뒤 연습함. AI 사용이 필요하지 않으면 그림이나 글로 연습함","rein":"적절한 요청에 구체적인 관심과 피드백을 제공하고, 정해진 시간에 동의한 친구들과 작품을 나눌 기회를 마련함"},{"beh":"친구들과 이야기를 나누고 싶을 때 자신의 경험이나 공동 관심사에 대해 질문하기 — 또래의 대화와 반응을 얻는 관심 획득 기능에 대응","teach":"“나는 이 장면이 재미있었어. 너는 어땠어?”처럼 다른 사람에 대한 허위 정보를 만들지 않고 대화를 시작하는 표현을 역할극으로 연습함","rein":"적절한 질문과 의견에 교사가 반응하고, 동의한 학생들과 대화를 이어갈 기회를 제공함. 존중하는 소통 행동을 구체적으로 칭찬함"},{"beh":"또래가 친구를 놀리는 자료를 더 만들어 달라고 할 때 “친구 사진으로는 만들지 않을래. 다른 주제로 하자”라고 말하고 안전한 활동을 제안하기 — 피해를 주는 제작 대신 공동 활동과 상호작용에 참여하는 방법으로 대응","teach":"제작을 요구받는 가상 상황에서 ‘거절하기–다른 주제 제안하기–필요하면 도움 요청하기’를 연습함. 실제 피해 자료는 사용하지 않음","rein":"적절하게 거절하고 대안을 제시한 행동을 인정하고, 교사가 안전한 공동 활동에 참여할 기회를 지원함"}],"s1":[["b","학급 전체에 ‘친구의 사진·이름을 마음대로 사용하지 않기’, ‘다른 사람이 하지 않은 행동이나 말을 실제인 것처럼 만들거나 전달하지 않기’를 기대행동으로 안내합니다."],["b","AI가 만든 이미지와 대화는 실제 사건이 일어났다는 증거가 아님을 가상 자료로 설명합니다."],["b","게시 전 ‘누군가를 놀리거나 곤란하게 하는가?’, ‘사진·이름을 사용할 동의를 받았는가?’, ‘실제로 있었던 일로 오해하게 만드는가?’를 확인하는 절차를 연습합니다."],["b","사실 여부가 불분명한 자료를 받으면 바로 믿거나 전달하지 않고, 교사·보호자에게 확인을 요청하도록 가르칩니다."],["b","조롱 자료에 웃는 반응을 보내거나 추가 제작을 요구하고 재전달하는 행동도 피해를 확대할 수 있음을 알려줍니다."],["b","친구를 소재로 삼지 않는 창작 활동과 존중하는 감상 표현을 연습하고, 적절한 공유·확인·도움 요청 행동을 구체적으로 칭찬합니다."],["b","실제 피해학생의 사진이나 가짜 대화를 학급 교육용 예시로 다시 공개하지 않습니다."],["q","“AI로 만든 그림이나 대화는 실제로 있었던 일처럼 보여도 사실이라는 뜻은 아니에요. 친구가 하지 않은 일을 한 것처럼 만들거나 퍼뜨리지 않아요. 다른 사람을 놀리는 자료를 받으면 더 전달하지 말고 어른에게 알려주세요.”"]],"s2":[["b","추가 게시·재전달을 우선 중단시키고, 피해를 받은 학생의 상태와 자료가 퍼진 범위를 확인합니다."],["b","작성 학생을 공개적으로 추궁하지 않고 개별적으로 이야기합니다. 제작·게시·재전달 과정과 당시 기대했던 반응을 나누어 확인합니다."],["b","“AI가 만들어 준 것”이라는 설명이 나오면, 결과물을 선택하여 게시·전달한 행동과 그 영향을 구체적으로 짚습니다."],["b","학생과 게시 전 확인 신호나 점검카드를 정합니다. 수업 중에는 약속한 비언어적 신호로 게시를 멈추고 내용을 확인하도록 돕습니다."],["b","실존 친구와 무관한 가상 자료로 ‘적절한 작품 소개’, ‘관심 요청’, ‘부적절한 제작 요구 거절’을 시범 보이고 학생이 직접 연습하게 합니다."],["b","일정 기간 교사가 초안을 확인한 뒤 공유하거나, 공개 게시 대신 교사에게 제출하는 방식으로 참여를 조정합니다. 적절한 참여가 안정되면 확인 지원을 점차 줄입니다."],["b","잘못된 정보의 정정은 교사의 안내 아래 필요한 대상에게 사실을 알리는 방식으로 진행합니다. 피해 자료를 다시 올리거나 피해학생에게 직접 연락하도록 요구하지 않습니다."],["b","방과 후 행동은 보호자와 협력하여 지원하고, 교사가 직접 확인한 내용과 보호자가 보고한 내용을 구분하여 기록합니다."],["q","“이 자료는 친구를 놀리거나, 친구가 하지 않은 일을 한 것처럼 보이게 하고 있어. 지금은 더 만들거나 보내지 말고 선생님과 확인하자. 이미 받은 친구에게도 다시 전달하지 않도록 안내할 거야.”"],["q","“친구들이 네 작품에 관심을 보이길 바랐니? 그렇다면 친구의 사진을 바꾸는 대신 네가 만든 인물이나 이야기로 소개할 수 있어. ‘내 작품을 봐줄래?’라고 요청하는 연습을 해보자.”"],["q","“방금 친구를 놀리는 자료를 만들어 달라는 요청에 거절하고 다른 주제를 제안했구나. 친구에게 피해를 주지 않으면서 함께할 방법을 찾았어.”"]],"s3":[["b","AI 활용 활동 전에 사용할 수 있는 자료의 범위, 공유 전 확인 절차, 다른 사람의 사진·이름 사용에 관한 규칙을 구체적으로 안내합니다."],["b","조롱이나 허위 내용을 담은 자료가 확인되면 추가 노출·전달을 차단하고, 필요한 범위에서 게시 방법을 교사 확인 후 공유하는 방식으로 조정한다는 점을 설명합니다."],["b","사실 확인에 필요한 자료는 학교의 정해진 절차에 따라 보존·관리하고, 노출 차단과 필요한 삭제 조치를 진행합니다. 증거를 남긴다는 이유로 여러 학생에게 재전달하지 않습니다."],["b","피해학생의 보호와 지원은 작성 학생의 반성이나 사과 여부와 관계없이 제공합니다. 허위 내용으로 오해한 학생들에게는 필요한 범위에서 사실을 바로잡습니다."],["b","조롱 이미지 게시, 허위 장면 게시, 가짜 대화 전달을 구분하여 기록합니다. 적절한 관심 요청·안전한 창작물 공유·제작 요구 거절이 어떤 기회에서 나타났는지도 함께 점검합니다."],["b","행동이 반복되면 또래의 반응, 활동 환경, 기능 가설, 대체행동 교수·강화의 실행 여부를 검토하여 행동계약·자기점검 등 필요한 집중지원을 선택합니다."],["b","특정 학생을 대상으로 피해가 이어지면 행동지원과 별도로 담당부서와 공유하여 필요한 보호와 사안 대응을 진행합니다."],["b","보호자에게는 AI 사용시간뿐 아니라 제작한 내용, 게시·전달 행동, 상대에게 미친 영향과 가정에서 연습할 대체행동을 중심으로 안내합니다."],["q","“친구를 조롱하거나 하지 않은 일을 한 것처럼 만든 자료는 더 퍼지지 않도록 조치할 거야. 당분간은 공유하기 전에 어른과 함께 확인하자. 네 생각과 작품을 안전하게 소개하고 싶을 때는 도와줄게.”"]],"caution":"AI로 만든 이미지나 대화라도 실제 친구를 조롱하거나 사실처럼 전달하면 피해를 줄 수 있음을 구체적으로 안내합니다. 추가 게시·전달을 막고 피해학생을 지원하며, 사실 확인을 이유로 자료를 학급 전체에 다시 보여주지 않습니다. 학생의 의도를 단정하기보다 제작·공유 전후의 상황과 또래의 반응을 살피고, 타인을 해치지 않는 창작 활동과 적절한 관심·도움 요청 방법을 가르칩니다. 게시물을 삭제한 뒤에도 허위 내용이나 놀림이 이어지는지 확인하고, 필요한 정정은 피해학생의 의사와 추가 노출 가능성을 고려하여 진행합니다.","types":["online"],"fns":["관심 획득"],"kw":["AI","이미지","합성","허위","가짜 대화","사진","딥페이크","조롱"],"situ":["온라인 대화"],"safety":true},{"id":"s4","cat":"smart","no":4,"lvText":"중등","lv":["중"],"t":"수업 중 태블릿으로 게임을 실행하고, 공유 플랫폼에 부적절한 자료(일베 등)나 비방 댓글을 게시하는 행동","scene":"모둠별 자료 검색을 위해 태블릿을 배부했으나, 검색 활동 대신 모바일 게임 화면을 실행하여 즐겼다. 교사가 학습 화면으로 돌아오도록 안내했으나 화면을 급히 숨기며 사용 사실을 부인했고, 사용 종료 후에도 기기를 반납하지 않고 버티다 주변 친구들의 이목을 집중시켰다.","abc":[{"r":"1회차(9/3)","a":"모둠별 자료 검색을 위해 태블릿을 배부함.","b":"검색 활동 대신 모바일 게임 화면을 실행하여 즐김. 교사의 학습 화면 복귀 안내에 화면을 급히 숨기며 부인하고, 사용 종료 후에도 기기를 반납하지 않고 버팀.","c":"주변 친구들의 이목이 집중되고 교사의 지도가 이어짐."},{"r":"2회차(9/8)","a":"모둠별 조사 결과를 공유 플랫폼에 게시하는 활동을 진행함.","b":"커뮤니티 성향의 부적절한 자료(일베 관련 이미지 등)를 결과물에 포함하여 업로드함. 교사의 즉각적인 삭제 지시에 장난스럽게 웃어넘기며 반성하지 않는 태도를 보임.","c":"일부 학생들이 웃으며 따라 하거나 소란스러워져 수업이 잠시 중단됨."},{"r":"3회차(9/15)","a":"다른 모둠의 결과물을 확인하고 상호 피드백을 남기는 활동을 진행함.","b":"마음에 들지 않는 모둠의 게시물에 조롱 섞인 비방 댓글을 반복해서 작성함.","c":"학생들이 소리 내어 웃으며 놀리는 분위기가 형성되어 피해 학생이 수치심과 속상함을 호소하며 활동을 거부함."}],"target":"디지털기기 기반 학습 상황에서 ‘학습 외 앱(게임 등) 실행 및 화면 은폐/반납 거부 행동’, ‘공유 플랫폼에 차별·혐오적 부적절 이미지 게시 행동’, ‘타 모둠 및 또래 결과물에 비방·조롱 댓글을 작성하는 행동’으로 정합니다. 기기 사용 이탈 시간, 업로드된 자료의 유형 및 수위, 게시 횟수, 행동 직후 또래의 웃음 및 교사 개입 양상을 구체적으로 기록합니다.","hyp":["○○의 행동은 디지털기기 접근이 허용되고 플랫폼을 통해 상호작용하는 상황에서 반복되었습니다. 게임 실행과 자극적 혐오 자료 게시, 비방 댓글 작성 직후 또래들이 웃거나 쳐다보며 소란스러워졌고 교사의 즉각적인 개입이 뒤따랐습니다. 이러한 기록을 볼 때, 과제 수행보다 즉각적인 도파민적 재미를 추구하는 ‘감각 추구/원하는 활동 획득 기능’과, 자극적인 일탈 행위를 통해 또래 집단의 주목과 인정을 받으려는 ‘관심 획득 기능’이 주된 요인으로 분석됩니다. 아울러 복잡한 검색이나 글쓰기 과제를 회피하려는 의도 및 디지털 윤리 의식의 결여가 복합적으로 작용하고 있습니다."],"causes":["감각 추구 및 원하는 활동 얻기: 읽기·정리 등 정적인 과제 부담에서 벗어나 시·청각적 자극이 강한 게임이나 유머 콘텐츠를 지속하려는지 확인합니다.","또래의 관심 및 동조 획득: 커뮤니티 밈이나 조롱 글을 매개로 학급 내에서 ‘재미있는 아이’, ‘주목받는 위치’를 차지하려는지 살핍니다.","과제 회피 기능: 자료 조사 및 피드백 작성 기술이 부족하여 활동에서 도피하기 위한 방편으로 기기 오용을 선택하는지 점검합니다.","디지털 리터러시 및 윤리성 부족: 온라인 게시물이 타인에게 미치는 심리적 피해와 법적·학교폭력적 파급력을 인지하지 못하는지 확인합니다."],"rintro":"","repl":[{"beh":"정해진 학습 과제를 완료하고 합법적 휴식 요청하기 (즉각적인 도파민·재미를 추구하는 감각 추구 및 과제 회피 기능 대응)","teach":"과제 수행 과정을 3단계(자료 검색 — 요약 기록 — 교사 확인) 체크리스트로 시각화하고, 1단계를 완료할 때마다 “선생님, 확인받고 2분간 자유 화면을 봐도 될까요?”라고 요청하는 절차를 연습합니다.","rein":"정해진 과제를 완수하고 정식으로 승인을 구했을 때 짧은 자유 검색권이나 스티커 포인트를 제공하여 과제 완수와 감각적 보상을 체계적으로 연계합니다."},{"beh":"공유 플랫폼에 ‘3단 피드백 문장 틀’로 댓글 작성하기 (비방·조롱 대신 건전하게 또래 관심 및 인정 획득 기능 대응)","teach":"‘장점 1가지 + 궁금한 점 1가지 + 응원’으로 구성된 문장 틀(“○○ 부분의 설명이 인상적이었어. 이 자료는 어디서 찾았는지 궁금해”)을 제공하고, 모의 게시물에 직접 모범 댓글을 작성해보는 연습을 진행합니다.","rein":"모범 문장 틀을 준수하여 작성한 댓글을 우수 피드백으로 선정하여 화면에 공유하고, 학급 친구들의 긍정적인 반응과 인정을 받을 수 있는 공식적인 기회를 제공합니다."},{"beh":"검색이나 글쓰기가 막힐 때 도움 요청하기 (어려운 학습 과제로부터 벗어나려는 과제 회피 기능 대응)","teach":"과제 수행 중 막히는 부분이 생겼을 때 게임 화면으로 이탈하지 않고, ‘도움 요청 신호 카드’를 책상에 올려두거나 “이 부분에 적절한 검색 키워드를 알려주세요”라고 구체적으로 질문하는 방법을 지도합니다.","rein":"도움을 요청하면 즉시 맞춤형 검색 키워드나 문장 예시를 힌트로 제공하고, 회피하지 않고 질문하여 과제에 다시 참여한 노력을 구체적으로 칭찬합니다."}],"s1":[["b","수업 시작 전 ‘태블릿 사용 3대 약속(학습 앱만 사용, 허위·비방 자료 게시 금지, 종소리와 함께 화면 덮기)’을 학급 공통 규칙으로 선포합니다."],["b","공유 플랫폼에서 피드백을 작성할 때 ‘사람’을 품평하지 않고 ‘결과물의 사실과 내용’에 집중해 작성하는 구체적 예시와 반면교사 예시를 교육합니다."],["b","친구의 부적절한 자료나 비방 댓글을 보았을 때 함께 웃거나 전파하지 않고, ‘조용히 화면 닫기 및 교사에게 즉시 알리기’ 대처 수칙을 학급 전체에 훈련시킵니다."],["b","기기 규정을 준수하고 유익한 학습 자료를 공유한 모둠에게 협력 점수 및 보상을 부여합니다."],["q","“스마트기기는 우리의 배움을 돕는 도구예요. 화면 너머에는 진짜 친구가 있습니다. 상처 주는 조롱이나 부적절한 자료 대신 결과물의 좋은 점과 질문을 남겨주세요. 올바르게 사용하는 사람이 진정한 디지털 시민입니다.”"]],"s2":[["b","기기 배부 전, 당일 완료해야 할 ‘학습 사이트 URL 목록’과 ‘최소 과제 분량’을 개별 체크리스트로 책상에 부착합니다."],["b","게임 실행이나 딴짓 징후가 보일 때 큰 소리로 꾸짖지 않고, 교사가 근접 이동하여 화면을 가리키는 비언어적 신호로 복귀를 유도합니다."],["b","부적절한 게시물이나 비방 댓글을 확인한 즉시 해당 기기의 네트워크 연결을 일시 차단하고, 교실 뒤편 또는 상담실에서 1:1로 사실을 확인합니다."],["b","행동 직후 과제를 면제해주지 않으며, 태블릿 대신 ‘종이 인쇄물과 필기도구’를 활용하여 원래의 학습 분량을 끝까지 완성하게 합니다."],["b","학생이 유혹을 이겨내고 정상 화면을 유지하거나 건전한 피드백을 등록한 순간을 포착하여 즉각적이고 구체적인 귓속말 칭찬을 건넵니다."],["q","“지금 게임 창을 띄우거나 친구를 비방하는 댓글을 적는 것은 우리 교실의 디지털 이용 규칙에 맞지 않아. 친구들에게 관심이나 재미를 얻고 싶다면, 정해진 문장 틀로 멋진 질문 댓글을 남겨보자. 네가 작성한 올바른 댓글을 선생님이 먼저 확인해 줄게.”"]],"s3":[["b","기기 사용 전 허용 범위와 함께, 규칙 위반 시 ‘디지털 기기 사용권 회수 및 종이 과제 대체’, ‘플랫폼 게시 권한 승인제 전환’ 등의 조치가 뒤따름을 예고합니다."],["b","부적절한 글·이미지를 작성했을 경우, 즉각 삭제 조치함과 동시에 디지털 윤리 성찰문 작성 및 사안에 따른 학교폭력(사이버폭력) 사안 접수 절차를 명확히 고지합니다."],["b","과제 시간 동안 비학습 사이트 접근 횟수 및 비방 게시 빈도를 기록하고, 반대로 규칙을 지켜 스스로 기기를 정상 반납한 횟수를 누적 관리합니다."],["b","행동이 반복될 경우 개별 행동계약을 체결하고, 보호자 상담을 통해 가정 내 미디어 사용 시간 점검 및 유해 매체 차단 앱 설치 등 가정-학교 연계 지도를 확립합니다."]],"caution":"디지털기기 오용 및 비방 글 게시는 일시적인 장난으로 치부할 경우 사이버 학교폭력으로 급격히 확대될 위험이 있습니다. 단순히 기기를 빼앗는 처벌적 대응에 그치지 않고, 왜곡된 인정 욕구를 건전한 피드백 참여로 전환할 수 있도록 문장 틀 제공 및 사전 점검 루틴을 체계화해야 합니다.","types":["device","online"],"fns":["감각 추구","원하는 것 얻기","관심 획득","회피·도피"],"kw":["태블릿","게임","혐오 자료","일베","비방 댓글","공유 플랫폼"],"situ":["수업 중","모둠활동"],"safety":false},{"id":"s5","cat":"smart","no":5,"lvText":"중등","lv":["중"],"t":"아침 조회 시 휴대전화 미제출(공기계 제출) 및 쉬는/점심시간 은닉 사용, 적발 시 거친 항의 행동","scene":"아침 조회 시간, 학급 규칙에 따라 휴대전화를 수거할 때 안 쓰는 공기계를 제출하고 자신의 진짜 스마트폰을 숨겼다. 이후 점심시간에 인적이 드문 계단 구석에서 모바일 게임을 하던 중 순찰을 돌던 교사에게 적발되었다. 교사가 기기 제출을 요구하자 \"쉬는 시간인데 왜 뺏어요? 내 폰이잖아요!\"라며 거칠게 항의하고 욕설을 내뱉었다. 실랑이가 길어지며 주변 학생들의 이목이 집중되었고, 결국 기기를 넘기지 않고 교실 밖으로 이탈하였다.","abc":[{"r":"1회차","a":"아침 조회 시 휴대전화를 일괄 수거함.","b":"제출 바구니에 미리 준비한 공기계를 넣고, 진짜 스마트폰은 주머니에 숨김.","c":"교사가 미제출 사실을 인지하지 못해 기기를 계속 소지하게 됨."},{"r":"2회차","a":"쉬는 시간 화장실 칸 안에서 몰래 SNS 숏폼 영상을 시청함.","b":"소리를 듣고 확인한 교사가 기기 제출을 지시하자, \"화장실도 마음대로 못 가요?\"라며 짜증을 냄.","c":"교사가 강압적으로 뺏지 않고 주의만 주고 넘어가며 기기를 뺏기지 않음."},{"r":"3회차","a":"점심시간 계단 구석에서 길드원(온라인 친구)들과 모바일 게임을 함.","b":"교사가 화면을 가리키며 기기 제출을 단호히 요구하자, 욕설을 하며 기기를 쥔 채 밖으로 무단 이탈함.","c":"교사가 뒤쫓지 못했고, 학생은 남은 점심시간 동안 게임을 지속함."}],"target":"관찰할 문제행동은 '학교 일과 중 스마트폰을 은닉하여 몰래 사용하는 행동', '기기 제출 요구 시 변명하거나 짜증을 내는 행동', '제지가 단호해질 때 욕설을 하며 장소를 이탈하는 행동'으로 정합니다. 스마트폰을 숨겨놓고 몰래 사용하는 전형적인 '은닉형 과몰입' 양상을 띠고 있으므로, 사용 장소, 적발 시 반응, 교사의 대처 결과를 구체적으로 기록합니다.","hyp":["학생의 행동은 교사의 직접적인 감시가 느슨해지는 자투리 시간(쉬는 시간, 점심시간)과 사각지대(화장실, 계단)에서 반복되었습니다. 적발되었을 때 강하게 항의하거나 현장을 이탈함으로써 결국 기기를 빼앗기지 않고 자신이 원하는 디지털 자극(게임, 영상)을 유지하는 결과를 얻었습니다. 이러한 기록을 볼 때, 즉각적인 도파민과 재미를 추구하는 '감각 추구 기능'과, 기기 압수라는 불편한 규칙 상황에서 벗어나려는 '회피·도피 기능'이 주된 요인으로 분석됩니다. 또한 중등 특성상 온라인 게임 내 또래(길드원)와의 약속을 지켜야 한다는 강박이 작용했을 가능성이 있습니다."],"causes":["스마트폰 과몰입 및 도파민 중독: 수면 부족, 무기력 등 스마트폰 사용으로 인해 일상생활이나 학업에 지장이 발생하고 있는지 선행 요인을 확인합니다.","또래 관계 및 온라인 소속감: 오프라인 또래 관계보다 온라인 게임이나 SNS 커뮤니티 내에서의 인정과 소속감을 더 중요하게 여기는지 살핍니다.","방어기제 및 대처 기술 부족: 자신의 잘못이 적발되었을 때, 수치심을 숨기기 위해 공격적인 태도(욕설, 도피)를 방어기제로 사용하는지 점검합니다."],"rintro":"","repl":[{"beh":"등교 시 정직하게 본인 스마트폰 제출하기 (규칙 회피 방지 및 감각 추구 지연)","teach":"CICO(일일 행동 점검)를 활용하여, 아침 조회 시 담임교사(또는 멘토 교사)와 1:1로 눈을 맞추며 기기를 직접 제출하는 루틴을 연습합니다.","rein":"프리맥 원리 적용: 5일 연속 정직하게 제출 시, 금요일 점심시간이나 방과 후에 '20분 자유 기기 사용권(합법적 사용)' 등 비금전적 강화를 제공합니다."},{"beh":"불만이 있을 때 '나 전달법'으로 적절히 항의/요청하기 (공격적 회피 및 통제 기능 대응)","teach":"\"쉬는 시간에 연락할 곳이 있어서 5분만 써도 될까요?\"와 같이 감정을 가라앉히고 정당하게 요구하거나 양해를 구하는 언어 표현을 역할극으로 연습합니다.","rein":"무작정 화를 내지 않고 차분히 요청한 행동 자체를 칭찬하고, 합당한 사유일 경우 교사의 지도하에 짧은 사용을 허용하여 긍정적 소통의 효능감을 줍니다."}],"s1":[["b","학기 초, 학급이나 학년 차원에서 전 교과에 공통으로 적용할 '디지털 기기 수거 및 보관 원칙'을 명확히 공동 수립하고 공지합니다."],["b","규칙 위반으로 적발되었을 때의 대처 수칙(변명하지 않기, 즉각 제출하기)을 시각 자료로 게시하고 반복 안내합니다."],["b","스마트폰 은닉 사용이나 수면 부족이 뇌 건강에 미치는 영향 등 디지털 리터러시(자기조절 역량) 교육을 보편적으로 실시합니다."],["b","학급 전체가 기기 제출 규칙을 잘 지켰을 때, 공동의 보상을 제공하여 긍정적 분위기를 조성합니다."]],"s2":[["b","사춘기 프라이버시 보호: 기기 은닉 사실을 적발했을 때 교실 한가운데나 복도에서 큰 소리로 공개적인 훈계나 압수를 시도하지 않습니다. 다른 학생들의 시선이 차단된 상담실이나 교무실 코너에서 1:1로 대화하여 방어기제 작용을 막습니다."],["b","중등 맞춤형 CICO(일일 행동 점검) 가동: 학년부장이나 신뢰하는 교과교사를 멘토로 지정하여, 아침과 하교 시 조용한 공간에서 기기 제출 및 일과 점검을 짧게(3분 이내) 진행합니다."],["b","오류교정절차 적용: 기기를 뺏기지 않으려 저항할 때 물리적 완력으로 대치하지 않습니다. \"지금 폰을 내면 하교할 때 바로 돌려받지만, 계속 거부하면 학칙에 따라 며칠간 분리 보관 조치될 수 있어\"라고 차분히 선택지를 주고 스스로 행동을 교정할 기회를 줍니다."],["b","오프라인에서 흥미를 느낄 수 있는 동아리, 체육 활동, 보드게임 등에 참여하도록 유도하여 온라인에 쏠린 관심을 분산시킵니다."]],"s3":[["b","학생과 보호자에게 「교원의 학생생활지도에 관한 고시」 제12조에 근거하여, 2회 이상 주의를 주었음에도 불응하거나 몰래 소지할 경우 '물품 분리 보관' 조치(예: 1주일간 학교 보관)가 이루어짐을 사전에 명확히 안내합니다."],["b","위기 상황(욕설, 무단 이탈 등)이 발생했을 때 기기를 압수하기 위해 무리하게 뒤쫓지 않으며, 안전을 우선 확인한 후 교내 위기행동관리팀(안전생활부 등)과 연계하여 생활규정에 따른 선도 조치를 별도로 진행함을 예고합니다."],["b","보호자 상담을 통해 가정 내 심야 시간 스마트폰 사용 현황을 점검하고, 수면 시간 확보를 위해 가정과 학교가 일관된 전자기기 분리 규칙을 적용하도록 협력(행동계약서 작성)합니다."]],"caution":"중학생의 '은닉형 과몰입'은 단순한 규칙 위반이 아니라, 현실의 스트레스나 소외감을 온라인 세계의 강한 자극으로 보상받으려는 중독 초기 증상일 수 있습니다. 학생을 범죄자 다루듯 취조하거나 스마트폰을 강압적으로 압수하는 것은 학생의 적대감만 키워 거짓말을 정교하게 만들 뿐입니다. 학생이 왜 그 시간에 반드시 게임이나 SNS를 해야만 했는지(도파민 중독, 온라인 관계 압박 등) 심리적 기저를 1:1 면담으로 살피고, 필요한 경우 Wee클래스 전문 상담을 병행하여 자기조절 역량을 기를 수 있도록 도와야 합니다.","types":["device","verbal"],"fns":["감각 추구","회피·도피"],"kw":["휴대전화 제출","공기계","은닉","숏폼","게임","항의","압수","핸드폰"],"situ":["기기 수거·제지","쉬는 시간"],"safety":false}];

const norm = s => String(s||"").toLowerCase().replace(/[\s·,.!?~"'“”‘’()\[\]\-_/:;]/g,"");
function bigr(s){const a=[];for(let i=0;i<s.length-1;i++)a.push(s.slice(i,i+2));return a}
function dice(a,b){ if(a.length<2||b.length<2) return a===b?1:0; const A=bigr(a), B=bigr(b); let m=0; const pool=B.slice(); for(const x of A){const i=pool.indexOf(x); if(i>-1){m++;pool.splice(i,1)}} return 2*m/(A.length+B.length); }
function stem(t){ let s=t; for(let i=0;i<2;i++) s=s.replace(/(했어요|해요|어요|아요|워요|해서|합니다|니다|하고|하는|에서|에게|으로|이랑|까지|부터|해|요|를|을|이|가|는|은|도|에|고|게|서|요)$/,""); return s; }
function analyze(q){
  const nq = norm(q);
  const toks = String(q||"").split(/[\s,./]+/).map(norm).filter(Boolean);
  const stems = Array.from(new Set(toks.concat(toks.map(stem)))).filter(t=>t.length>=2);
  const types=new Set(), kws=new Set(), situ=new Set(), labels=new Set();
  if(nq) for(const e of SYN){
    const hit = e.t.some(tr=>{const n=norm(tr); return nq.includes(n) || stems.some(t=>t.length>=2 && n.length>=2 && dice(t,n)>=0.67);});
    if(hit){ if(e.type){types.add(e.type); labels.add(e.k)} if(e.k) kws.add(e.k); if(e.s){situ.add(e.s); labels.add(e.s)} }
  }
  return {q, nq, toks:stems, types, kws, situ, labels};
}
function kwMatch(an, word){
  const n = norm(word); if(!an.nq || n.length<1) return false;
  if(an.nq.includes(n)) return true;
  return an.toks.some(t=> t.length>=2 && (n.includes(t) || (t.length>=3 && dice(t,n)>=0.6)));
}
function caseText(c){
  if(!c._txt) c._txt={
    head:norm(c.t+" "+c.target),
    situ:norm(c.scene+" "+c.abc.map(r=>r.a+" "+r.c).join(" ")),
    body:norm([c.hyp.join(" "),c.causes.join(" "),c.repl.map(r=>r.beh+" "+r.teach+" "+r.rein).join(" "),c.s1.concat(c.s2,c.s3).map(x=>x[1]).join(" "),c.caution].join(" "))
  };
  return c._txt;
}
function scoreCase(c, an){
  let b=0, s=0, t=0; const hits=new Set(); const T=caseText(c);
  for(const ty of c.types) if(an.types.has(ty)){ b+=6; hits.add(TYPES[ty].label) }
  for(const k of c.kw){ if(kwMatch(an,k) || an.kws.has(k)){ b+=3; hits.add(k) } }
  for(const x of c.situ){ if(an.situ.has(x) || kwMatch(an,x)){ s+=3; hits.add(x) } }
  for(const tk of an.toks){ if(tk.length<2) continue; if(T.head.includes(tk)) b+=2; else if(T.situ.includes(tk)) s+=2; else if(T.body.includes(tk)) t+=1; }
  return {b, s, t, total:b+s+t, hits:Array.from(hits).slice(0,5)};
}
function levelOk(c, lv){ if(lv==="all") return true; if(lv==="초") return c.lv.includes("초"); return c.lv.includes("중")||c.lv.includes("고"); }
function runSearch(st){
  const an = analyze(st.q);
  let list = CASES.map(c=>({c, sc: an.nq ? scoreCase(c,an) : {b:0,s:0,t:0,total:0,hits:[]}}));
  if(an.nq) list = list.filter(x=>x.sc.total>0);
  list = list.filter(x=> levelOk(x.c, st.level) && (st.type==="all"||x.c.types.includes(st.type)) && (st.cat==="all"||x.c.cat===st.cat));
  const order = c => ({"초":0,"중":1,"고":2})[c.lv[0]];
  const base = (x,y)=> x.c.cat.localeCompare(y.c.cat)||x.c.no-y.c.no;
  const by = {
    behavior:(x,y)=> (y.sc.b-x.sc.b)||(y.sc.total-x.sc.total)||base(x,y),
    situation:(x,y)=> (y.sc.s-x.sc.s)||(y.sc.total-x.sc.total)||base(x,y),
    level:(x,y)=> (order(x.c)-order(y.c))||(y.sc.total-x.sc.total)||base(x,y)
  };
  list.sort(by[st.sort]||by.behavior);
  return {an, list};
}

/* =========================================================
   저장소: IndexedDB (불가 시 메모리 대체)
   ========================================================= */
const DB = {
  db:null, ok:false, mem:{meta:{},students:{},records:{},draft:{}},
  async open(){
    try{
      if(!("indexedDB" in window)) throw new Error("no idb");
      this.db = await new Promise((res,rej)=>{
        const r = indexedDB.open("dahaeng-pbs-local",1);
        r.onupgradeneeded = ()=>{ const d=r.result; for(const n of ["meta","students","records","draft"]) if(!d.objectStoreNames.contains(n)) d.createObjectStore(n,{keyPath:"id"}); };
        r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error); r.onblocked = ()=>rej(new Error("blocked"));
        setTimeout(()=>rej(new Error("timeout")),4000);
      });
      this.ok = true;
    }catch(e){ this.ok=false; }
  },
  tx(store,mode,fn){ return new Promise((res,rej)=>{ let out; try{ const t=this.db.transaction(store,mode); const r=fn(t.objectStore(store)); if(r) r.onsuccess=()=>{out=r.result}; t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error||new Error("abort")); }catch(e){rej(e)} }); },
  async get(s,id){ if(!this.ok) return this.mem[s][id]; return this.tx(s,"readonly",o=>o.get(id)); },
  async all(s){ if(!this.ok) return Object.values(this.mem[s]); return this.tx(s,"readonly",o=>o.getAll()); },
  async put(s,obj){ if(!this.ok){ this.mem[s][obj.id]=obj; return; } return this.tx(s,"readwrite",o=>{o.put(obj)}); },
  async putMany(s,objs){ if(!this.ok){ objs.forEach(o=>this.mem[s][o.id]=o); return; } return this.tx(s,"readwrite",o=>{objs.forEach(x=>o.put(x))}); },
  async del(s,id){ if(!this.ok){ delete this.mem[s][id]; return; } return this.tx(s,"readwrite",o=>{o.delete(id)}); },
  async delMany(s,ids){ if(!this.ok){ ids.forEach(i=>delete this.mem[s][i]); return; } return this.tx(s,"readwrite",o=>{ids.forEach(i=>o.delete(i))}); },
  async clear(s){ if(!this.ok){ this.mem[s]={}; return; } return this.tx(s,"readwrite",o=>{o.clear()}); }
};

/* =========================================================
   암호화: PBKDF2-SHA256 → KEK, AES-GCM-256 DEK(래핑) + 레코드별 AAD
   ========================================================= */
const te = new TextEncoder(), td = new TextDecoder();
const cryptoOK = !!(window.crypto && crypto.subtle);
const ITER = 310000;
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
function toB64(u8){ let s=""; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); }
function fromB64(b){ const s=atob(b); const u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }
async function deriveKey(pw,salt,iter){ const base=await crypto.subtle.importKey("raw",te.encode(pw),"PBKDF2",false,["deriveKey"]); return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]); }
async function importDek(raw){ return crypto.subtle.importKey("raw",raw,{name:"AES-GCM"},false,["encrypt","decrypt"]); }
async function seal(obj,aad,key=state.key){ const iv=rnd(12); const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv,additionalData:te.encode(aad)},key,te.encode(JSON.stringify(obj)))); return {iv,ct}; }
async function unseal(rec,aad,key=state.key){ const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:rec.iv,additionalData:te.encode(aad)},key,rec.ct); return JSON.parse(td.decode(pt)); }

async function createVault(pw){
  const salt=rnd(16), k=await deriveKey(pw,salt,ITER), raw=rnd(32), wiv=rnd(12);
  const wct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv:wiv,additionalData:te.encode("vault")},k,raw));
  state.key = await importDek(raw); raw.fill(0);
  const vault={id:"vault",v:1,salt,iter:ITER,wiv,wct,createdAt:Date.now()};
  await DB.put("meta",vault); state.vault=vault;
}
async function unwrap(pw,v){ const k=await deriveKey(pw,v.salt,v.iter); try{ return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:v.wiv,additionalData:te.encode("vault")},k,v.wct)); }catch(e){ return null; } }
async function unlockVault(pw){ const raw=await unwrap(pw,state.vault); if(!raw) return false; state.key=await importDek(raw); raw.fill(0); await loadAll(); return true; }
async function changePassword(oldPw,newPw){
  const raw=await unwrap(oldPw,state.vault); if(!raw) return false;
  const salt=rnd(16), k=await deriveKey(newPw,salt,ITER), wiv=rnd(12);
  const wct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv:wiv,additionalData:te.encode("vault")},k,raw)); raw.fill(0);
  const vault={...state.vault,salt,iter:ITER,wiv,wct,changedAt:Date.now()}; await DB.put("meta",vault); state.vault=vault; return true;
}

function openModal({title, html, actions=[{label:"닫기",value:null,kind:"ghost"}], init}){
  return new Promise(res=>{
    const root=$("#modalRoot"); const prev=document.activeElement;
    root.innerHTML=`<div class="scrim"></div><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"><h2 id="mTitle">${esc(title)}</h2><div class="m-body">${html}</div><div class="m-actions">${actions.map((a,i)=>`<button type="button" class="btn ${a.kind||"ghost"}" data-mi="${i}">${a.icon?ic(a.icon,"sm"):""}${esc(a.label)}</button>`).join("")}</div></div>`;
    root.hidden=false;
    const onKey=e=>{ if(e.key==="Escape") close(null); if(e.key==="Tab"){ const f=$$("button,input,select,textarea",root).filter(x=>!x.disabled); if(!f.length) return; const first=f[0], last=f[f.length-1]; if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()} else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()} } };
    function close(v){ document.removeEventListener("keydown",onKey); root.hidden=true; root.innerHTML=""; modalClose=null; if(prev&&prev.focus&&document.contains(prev)) prev.focus(); res(v); }
    modalClose=close;
    document.addEventListener("keydown",onKey);
    $(".scrim",root).onclick=()=>close(null);
    $$("[data-mi]",root).forEach(b=>b.onclick=async()=>{ const a=actions[+b.dataset.mi]; if(a.validate){ const v=await a.validate(root); if(v===false) return; close(v===true||v===undefined?a.value:v);} else close(a.value); });
    $$("form",root).forEach(f=>f.addEventListener("submit",e=>{e.preventDefault(); const p=$$("[data-mi]",root).pop(); p&&p.click();}));
    if(init) init(root);
    const f=$("input,select,textarea",root)||$$("[data-mi]",root).pop(); f&&f.focus();
  });
}

async function saveFile(filename, text, mime="application/json"){
  try{
    if(window.claude && typeof claude.use==="function"){
      const dl = await claude.use("downloads");
      if(dl){ await dl.save({filename, data:text}); return "saved"; }
    }
  }catch(e){ if(e && e.code==="declined") return "declined"; if(e && e.code && !["unavailable","not_granted","capability_disabled","capability_removed"].includes(e.code)) throw e; }
  const blob = text instanceof Blob ? text : new Blob([text],{type:mime}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; document.body.append(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove()},1500); return "saved";
}

/* 마그넷 효과: 점들이 스프링으로 아이콘 주변에 끌려왔다가 제자리로 돌아감 (framer-motion spring 값 이식) */
const MAG_COLORS = {find:["--navy","--mauve","--teal","--caramel"], rec:["--teal","--navy","--mauve","--caramel"]};
function initMagnets(){
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  $$("[data-mag]").forEach(card=>{
    const field=$(".mag-field",card), target=$("[data-mag-target]",card), kind=card.classList.contains("rec")?"rec":"find";
    const N = window.innerWidth<600 ? 14 : 20; const P=[]; let on=false, raf=0, last=0;
    for(let i=0;i<N;i++){ const el=document.createElement("span"); el.className="mag-dot"; el.style.background=`var(${MAG_COLORS[kind][i%4]})`; const s=5+Math.round(Math.random()*6); el.style.width=el.style.height=s+"px"; field.append(el); P.push({el,s,x:0,y:0,vx:0,vy:0,hx:0,hy:0}); }
    const draw=p=>{ p.el.style.transform=`translate(${(p.x-p.s/2).toFixed(1)}px,${(p.y-p.s/2).toFixed(1)}px)`; };
    const home=()=>{ const W=card.clientWidth, H=card.clientHeight; P.forEach(p=>{ p.hx=10+Math.random()*(W-20); p.hy=10+Math.random()*(H-20); }); };
    const targetOf=i=>{ const cr=card.getBoundingClientRect(), tr=target.getBoundingClientRect(); const cx=tr.left-cr.left+tr.width/2, cy=tr.top-cr.top+tr.height/2; const a=i/N*Math.PI*2, r=tr.width/2+8+(i%3)*6; return [cx+Math.cos(a)*r, cy+Math.sin(a)*r]; };
    function step(t){
      const dt = last ? Math.min(0.032,(t-last)/1000) : 0.016; last=t;
      const k=on?50:100, c=on?10:15; let moving=false;
      P.forEach((p,i)=>{ const [tx,ty]=on?targetOf(i):[p.hx,p.hy];
        p.vx+=(k*(tx-p.x)-c*p.vx)*dt; p.vy+=(k*(ty-p.y)-c*p.vy)*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; draw(p);
        if(Math.abs(tx-p.x)>.4||Math.abs(ty-p.y)>.4||Math.abs(p.vx)>.4||Math.abs(p.vy)>.4) moving=true; });
      if(moving && document.contains(card)) raf=requestAnimationFrame(step); else { raf=0; last=0; }
    }
    const kick=()=>{ if(!raf){ last=0; raf=requestAnimationFrame(step); } };
    function set(v){ if(on===v) return; on=v; card.classList.toggle("is-on",v);
      if(reduce){ P.forEach((p,i)=>{ const [tx,ty]=on?targetOf(i):[p.hx,p.hy]; p.x=tx; p.y=ty; draw(p); }); return; } kick(); }
    home();
    // 첫 화면: 아이콘에서 흩어져 나오는 한 번의 움직임
    P.forEach((p,i)=>{ if(reduce){ p.x=p.hx; p.y=p.hy; } else { const [tx,ty]=targetOf(i); p.x=tx; p.y=ty; } draw(p); });
    if(!reduce) setTimeout(kick, 120);
    card.addEventListener("pointerenter",e=>{ if(e.pointerType!=="touch") set(true); });
    card.addEventListener("pointerleave",e=>{ if(e.pointerType!=="touch") set(false); });
    card.addEventListener("focus",()=>set(true)); card.addEventListener("blur",()=>set(false));
    card.addEventListener("pointerdown",e=>{ if(e.pointerType==="touch"){ card._touch=true; set(true); } });
    card.addEventListener("pointercancel",()=>{ card._touch=false; set(false); });
    card.addEventListener("click",e=>{ if(card._touch && !reduce){ e.preventDefault(); card._touch=false; const h=card.getAttribute("href").slice(1); setTimeout(()=>{ if(location.hash==="#"+h) render(true); else location.hash=h; },420); } });
    if(window.ResizeObserver){ let w=card.clientWidth; new ResizeObserver(()=>{ if(Math.abs(card.clientWidth-w)<2) return; w=card.clientWidth; home(); if(!on){ P.forEach(p=>{p.x=p.hx;p.y=p.hy;draw(p)}); } }).observe(card); }
  });
}

function relatedCases(d, level){
  const bChips=d.b.tags.map(id=>B_BY[id]).filter(Boolean);
  const bTypes=new Set(bChips.flatMap(c=>c.types));
  const bKw=bChips.flatMap(c=>c.kw||[]).map(norm);
  const aKw=d.a.none?[]:d.a.tags.map(id=>A_BY[id]).filter(Boolean).flatMap(c=>c.kw);
  const bAn=analyze(d.b.text), aAn=analyze(d.a.none?"":d.a.text);
  if(!bChips.length && !bAn.nq) return [];
  const out=[];
  for(const c of CASES){
    let sc=0; const hits=new Set(); const T=caseText(c);
    for(const ty of c.types){ if(bTypes.has(ty)){ sc+=6; hits.add("B · "+TYPES[ty].label) } else if(bAn.types.has(ty)){ sc+=4; hits.add("B · "+TYPES[ty].label) } }
    for(const k of c.kw){ if(bKw.includes(norm(k)) || kwMatch(bAn,k)){ sc+=3; hits.add("B · "+k) } }
    for(const tk of bAn.toks){ if(tk.length>=2 && T.head.includes(tk)) sc+=1 }
    if(sc===0) continue;
    for(const s of c.situ){ if(aKw.includes(s) || aAn.situ.has(s) || kwMatch(aAn,s)){ sc+=2; hits.add("A · "+s) } }
    if(levelOk(c,level)) out.push({c,sc,hits:Array.from(hits).slice(0,4)});
  }
  return out.sort((x,y)=>y.sc-x.sc||x.c.cat.localeCompare(y.c.cat)||x.c.no-y.c.no).slice(0,8);
}

  state.saving=true; const btn=$("[data-act=commit]"); if(btn){ btn.disabled=true; btn.textContent="저장 중…"; }
  const now=Date.now(); const prev=d.id?state.records.find(r=>r.id===d.id):null;
  const rec={...clone(d), id:d.id||uid("rec"), status:"done", createdAt:prev?prev.createdAt:now, updatedAt:now};
  if(prev&&prev.sample) rec.sample=true;
  try{
    const sealed=await seal(rec,"records:"+rec.id);
    await DB.put("records",{id:rec.id,...sealed});   // 트랜잭션 완료 후에만 성공 처리
    state.records = state.records.filter(r=>r.id!==rec.id).concat(rec);
    await DB.del("draft","current").catch(()=>{});
    state.draft=newDraft(); state.draftAt=null;
    state.review={mode:"saved", id:rec.id};
    state.saving=false; render(true); toast(prev?"수정 내용을 저장했습니다":"완료 저장했습니다");
  }catch(e){
    state.saving=false; state.review={mode:"draft", error:"브라우저 저장소에 쓰지 못했습니다."}; render(true);
  }
}

        const file=JSON.stringify({format:"dahaeng-pbs-backup",v:1,kdf:{name:"PBKDF2-SHA256",iter:ITER,salt:toB64(salt)},iv:toB64(iv),ct:toB64(ct)});
        const r=await saveFile(`pbs-abc-backup-${fileStamp()}.json`,file,"application/json");
        if(r==="declined") toast("내려받기를 취소했습니다"); else { toast("암호화 백업 파일을 만들었습니다"); $("#bk1").value=""; $("#bk2").value=""; }
      }catch(err){ fail("백업 파일을 만들지 못했습니다. 다시 시도하세요."); }
      return reset();
    }
    const rs=exportRecords(); if(!rs.length) return fail("조건에 맞는 기록이 없어요. 학생이나 기간을 바꿔 보세요.");
    const pw=$("#exPw").value; if(!pw) return fail("이 기기 전용 암호를 입력하세요.");
    b.disabled=true; b.textContent="암호 확인 중…";
    const raw=await unwrap(pw,state.vault); if(!raw){ reset(); return fail("이 기기 전용 암호가 맞지 않습니다."); } raw.fill(0);
    try{
      b.textContent = fmt==="xlsx" ? "Excel 만드는 중…" : "PDF 만드는 중…";
      const out = fmt==="xlsx" ? await buildXlsx(rs) : await buildPdf(rs);
      const r=await saveFile(out.name,out.data,out.mime);
      if(r==="declined") toast("내려받기를 취소했습니다"); else { toast(`${fmt==="xlsx"?"Excel":"PDF"} 파일을 만들었습니다 · 기록 ${rs.length}건`); $("#exPw").value=""; }
    }catch(err){ fail(err&&err.message==="lib" ? "파일을 만드는 도구를 불러오지 못했습니다. 인터넷 연결을 확인하고 다시 시도하세요." : "파일을 만들지 못했습니다. 다시 시도하세요."); }
    reset();
  });
};

async function buildXlsx(rs){

      blk.innerHTML=`${r.studentId!==lastStu?`<div class="pdf-stu">${esc(x.s.code||"학생 미상")}${x.s.alias?` <span>${esc(x.s.alias)}</span>`:""}</div>`:""}
        <div class="pdf-card"><div class="pdf-when"><b>${esc(fmtDateFull(r.date))} ${esc(r.time)}</b>${ctx?`<span>${esc(ctx)}</span>`:""}</div>

        page.append(blk);

    }
    pages.forEach((p,i)=>p.insertAdjacentHTML("beforeend",`<div class="pdf-foot"><span>다:행 PBS 길잡이 · 암호화되지 않은 문서</span><span>${i+1} / ${pages.length}</span></div>`));
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const { jsPDF } = window.jspdf; const pdf=new jsPDF({unit:"pt",format:"a4",compress:true});
    for(let i=0;i<pages.length;i++){
      const cv=await window.html2canvas(pages[i],{scale:2,backgroundColor:"#ffffff",logging:false,width:794,height:H,windowWidth:794,scrollX:0,scrollY:0,onclone:(doc)=>{ const h=doc.querySelector(".pdf-host"); if(h){ h.style.left="0"; h.style.zIndex="0"; } }});

    return {name:`pbs-abc-records-${fileStamp()}.pdf`, mime:"application/pdf", data:pdf.output("blob")};
  } finally { host.remove(); }
}
async function restoreCheck(){

  er.hidden=true; const f=$("#rsFile").files[0], pw=$("#rsPw").value;

  let j; try{ j=JSON.parse(await f.text()); }catch(e){ return fail("백업 파일 형식이 아닙니다. 이 앱에서 만든 .json 파일을 선택하세요."); }

  try{
    const k=await deriveKey(pw,fromB64(j.kdf.salt),j.kdf.iter);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:fromB64(j.iv),additionalData:te.encode("dahaeng-pbs-backup-v1")},k,fromB64(j.ct));
    const data=JSON.parse(td.decode(pt));
    if(!Array.isArray(data.students)||!Array.isArray(data.records)) throw new Error("shape");
    const ids=new Set(state.students.map(s=>s.id).concat(state.records.map(r=>r.id)));

    state.restore={data,conflicts}; render(); setTimeout(()=>{ const s=$(".restore-sum"); s&&s.scrollIntoView({block:"nearest"}); },30);

async function restoreApply(){
  const rs=state.restore; if(!rs) return; const mode=($("input[name=rsMode]:checked")||{}).value||"merge";
  if(mode==="replace"){ const ok=await confirmBox({title:"전체 교체",body:`이 기기의 학생 ${state.students.length}명과 기록 ${state.records.length}건을 지우고 백업 내용으로 바꿉니다.`,ok:"전체 교체",danger:true,typeText:"전체 교체"}); if(!ok) return; }
  try{
    if(mode==="replace"){ await DB.clear("students"); await DB.clear("records"); state.students=[]; state.records=[]; }
    const sid=new Set(state.students.map(s=>s.id)), rid=new Set(state.records.map(r=>r.id));
    const sIn=rs.data.students.filter(s=>mode!=="merge"||!sid.has(s.id)), rIn=rs.data.records.filter(r=>mode!=="merge"||!rid.has(r.id));
    // 코드 중복 처리: 다른 학생이 같은 코드를 쓰면 뒤에 -B 붙임
    for(const s of sIn){ if(state.students.some(x=>x.id!==s.id && x.code===s.code)) s.code=s.code+"-B"; }
    const ss=[]; for(const s of sIn) ss.push({id:s.id,...await seal(s,"students:"+s.id)}); await DB.putMany("students",ss);
    const rr=[]; for(const r of rIn) rr.push({id:r.id,...await seal(r,"records:"+r.id)}); await DB.putMany("records",rr);
    const sIds=new Set(sIn.map(s=>s.id)), rIds=new Set(rIn.map(r=>r.id));
    state.students=state.students.filter(s=>!sIds.has(s.id)).concat(sIn); state.records=state.records.filter(r=>!rIds.has(r.id)).concat(rIn);
    state.restore=null; render(); toast(`학생 ${sIn.length}명, 기록 ${rIn.length}건을 복원했습니다`);
  }catch(e){ toast("복원하지 못했습니다. 저장 공간을 확인하세요.","err"); }
}

      toast(editing?"수정을 취소했습니다":"작성 내용을 비웠습니다"); break; }
    case "newRec": {
      if(draftHasContent(d)){ const ch=await openModal({title:"작성 중인 기록이 있어요",html:"<p>이어서 쓰거나, 비우고 새로 쓸 수 있어요.</p>",actions:[{label:"취소",value:null},{label:"비우고 새로 쓰기",value:"new",kind:"danger"},{label:"이어서 쓰기",value:"cont",kind:"primary"}]}); if(!ch) break; if(ch==="new"){ state.draft=newDraft(); await DB.del("draft","current").catch(()=>{}); } }
      go("record"); break; }
    case "editRec": {
      const r=state.records.find(x=>x.id===el.dataset.id); if(!r) break;
      if(draftHasContent(d) && d.id!==r.id){ const ok=await confirmBox({title:"작성 중인 기록이 있어요",body:"작성 중이던 내용을 비우고 이 기록을 수정할까요?",ok:"비우고 수정",danger:true}); if(!ok) break; }
      const {status,createdAt,updatedAt,sample,...rest}=clone(r); state.draft=rest; saveDraftNow(); go("record"); break; }
    case "delRec": {
      const r=state.records.find(x=>x.id===el.dataset.id); if(!r) break;
      const ok=await confirmBox({title:"기록 삭제",body:`${esc(stuName(r.studentId))} · ${esc(fmtDate(r.date))} ${esc(r.time)} 기록을 삭제합니다. 되돌릴 수 없어요.`,ok:"삭제",danger:true}); if(!ok) break;
      try{ await DB.del("records",r.id); state.records=state.records.filter(x=>x.id!==r.id); state.review=null; go("history"); toast("기록을 삭제했습니다"); }catch(err){ toast("삭제하지 못했습니다","err"); } break; }
    case "openRec": state.review={mode:"saved",id:el.dataset.id}; go("review"); break;
    case "toHistory": go("history"); break;
    case "newStudent": { const s=await studentDialog(null); if(s){ if(state.route==="record"){ d.studentId=s.id; const sel=$("#fStu"); sel.insertAdjacentHTML("beforeend",`<option value="${esc(s.id)}">${esc(s.code)}${s.alias?" · "+esc(s.alias):""}</option>`); sel.value=s.id; touchDraft(); } else render(); } break; }
    case "editStudent": { const s=await studentDialog(stuById(el.dataset.id)); if(s) render(); break; }
    case "delStudent": deleteStudent(el.dataset.id); break;
    case "stuRecords": state.hist={sid:el.dataset.id,from:"",to:"",type:"all",place:"all"}; go("history"); break;
    case "loadSample": loadSample(); break;
    case "clearSample": clearSample(); break;
    case "clearHist": state.hist={sid:"all",from:"",to:"",type:"all",place:"all"}; render(); break;
    case "ack": state.settings.ack=true; state.settings.ackAt=Date.now(); await saveSettings(); render(true); break;
    case "forgot": {
      const ok=await confirmBox({title:"암호를 잊었어요",body:"암호는 이 기기 밖 어디에도 저장되지 않아 되찾을 수 없습니다. 백업 파일이 있다면 이 기기의 기록을 모두 지우고 새 암호를 정한 뒤 백업에서 복원할 수 있어요.",ok:"기록 지우고 새로 시작",danger:true,typeText:"모두 삭제"});
      if(ok){ for(const s of ["students","records","draft"]) await DB.clear(s); await DB.del("meta","vault"); state.vault=null; updateLockBtn(); render(true); toast("기록을 지웠습니다. 새 암호를 정하세요"); } break; }
    case "lockNow": lockNow(); break;
    case "changePw": {
      const res=await openModal({title:"암호 바꾸기",html:`<form class="stack" autocomplete="off"><input type="text" name="username" value="pbs-local" autocomplete="username" hidden><div class="field"><label for="cp0">지금 암호</label><input type="password" id="cp0" class="inp" autocomplete="current-password"></div><div class="field"><label for="cp1">새 암호 (8자 이상)</label><input type="password" id="cp1" class="inp" autocomplete="new-password"></div><div class="field"><label for="cp2">새 암호 다시 입력</label><input type="password" id="cp2" class="inp" autocomplete="new-password"></div><span class="err" id="cpErr" hidden></span></form>`,
        actions:[{label:"취소",value:null},{label:"바꾸기",kind:"primary",value:true,validate:async r=>{ const e2=$("#cpErr",r), f=m=>{e2.textContent=m;e2.hidden=false;return false;}; const o=$("#cp0",r).value,n1=$("#cp1",r).value,n2=$("#cp2",r).value; if(n1.length<8) return f("새 암호는 8자 이상이어야 해요."); if(n1!==n2) return f("새 암호가 서로 다릅니다."); const ok=await changePassword(o,n1); if(!ok) return f("지금 암호가 맞지 않습니다."); return true; }}]});
      if(res) toast("암호를 바꿨습니다"); break; }
    case "noticeModal": openModal({title:"개인정보 보호 안내", html:`<ul class="notice-list compact">${NOTICES.map(n=>`<li><span class="ib">${ic(n.i)}</span><div><b>${esc(n.t)}</b><p>${esc(n.p)}</p></div></li>`).join("")}</ul>${state.settings.ackAt?`<p class="small muted">${esc(fmtStamp(state.settings.ackAt))}에 확인한 안내입니다.</p>`:""}`, actions:[{label:"닫기",value:null,kind:"primary"}]}); break;
    case "toExport": state.exp={fmt:"xlsx", sid:state.hist.sid, from:state.hist.from, to:state.hist.to}; go("security"); setTimeout(()=>{ const c=$("#bkCard"); c&&c.scrollIntoView({block:"start",behavior:"smooth"}); },60); break;
    case "jumpTo": { const t=document.getElementById(el.dataset.v); if(t){ t.scrollIntoView({behavior:"smooth",block:"start"}); } break; }
    case "dlForm": if(el.getAttribute("aria-disabled")!=="true") downloadForm(el.dataset.id, el); break;
    case "rsCheck": restoreCheck(); break;
    case "rsApply": restoreApply(); break;
    case "wipeAll": wipeAll(); break;
    case "more": {
      const v=await openModal({title:"더보기",html:`<div class="stack">${[["students","users","학생 관리"],["library","book","PBS 자료실"],["privacy","shield","개인정보 보호 안내"],["security","sliders","설정·보안"]].map(([h,i,l])=>`<button type="button" class="tile" data-go="${h}" style="width:100%"><span class="ib">${ic(i,"lg")}</span><span><b>${l}</b></span></button>`).join("")}</div>`,actions:[{label:"닫기",value:null}],
        init:r=>$$("[data-go]",r).forEach(b=>b.onclick=()=>{ modalClose(b.dataset.go); })});
      if(v) go(v); break; }
  }
});
document.addEventListener("input", e=>{
  const t=e.target, d=state.draft;
  if(t.dataset.tx && d){ d[t.dataset.tx].text=t.value; touchDraft(); if(state.panel.open && t.dataset.tx!=="c") drawPanelSoft(); }
  else if(t.dataset.f && d){ let v=t.value; if(t.dataset.f==="freq"||t.dataset.f==="dur"){ v=v.replace(/[^\d]/g,"").slice(0,4); t.value=v; } d[t.dataset.f]=v; touchDraft(); }
  else if(t.dataset.hf){ state.hist[t.dataset.hf]=t.value; drawHistory(); }
});
const drawPanelSoft = debounce(()=>{ if(state.panel.open && !state.panel.caseId) { const active=document.activeElement; drawPanel(); if(active&&document.contains(active)) active.focus({preventScroll:true}); } },400);
document.addEventListener("change", e=>{
  const t=e.target, d=state.draft;
  if(t.dataset.sf){ state.search[t.dataset.sf]=t.value; drawResults(); }
  else if(t.dataset.none && d){ d[t.dataset.none].none=t.checked; touchDraft(); if(state.panel.open) drawPanel(); }
  else if(t.dataset.f==="studentId" && d){ d.studentId=t.value; touchDraft(); }
  else if(t.dataset.hf){ state.hist[t.dataset.hf]=t.value; drawHistory(); }
});
$("#lockBtn").addEventListener("click",()=>{ if(state.key) lockNow(); else go("record"); });
window.addEventListener("online",()=>{ if(state.route==="search") drawResults(); });
window.addEventListener("offline",()=>{ if(state.route==="search") drawResults(); });

/* =========================================================
   시작
   ========================================================= */
(async function boot(){
  $("#footVer").textContent = `다:행 PBS 길잡이 ${APP_VERSION} · ${CONTENT.name} ${CONTENT.version}`;
  $("#verSmall").textContent = `자료집 ${CONTENT.version.split(" ")[0]} 기준`;
  await DB.open();
  try{ const s=await DB.get("meta","settings"); if(s) state.settings={...state.settings,...s}; }catch(e){}
  try{ const v=await DB.get("meta","vault"); if(v) state.vault=v; }catch(e){}
  const [r,p]=parseHash(); state.route=r; state.param=p;
  updateLockBtn(); render();
})();
</script>

</body>
</html>
